  if(daScegliere.length){ toast(`❓ Scegli il lotto per: ${daScegliere.map(x=>x.ingrediente).join(", ")}`); return; }
  const abb = window._componiAbbattuto || {attivo:false};
  let abbattimento = null;
  if(abb.attivo){
    const temp = abb.temperatura!==""? parseFloat(abb.temperatura) : null;
    const durata = abb.durata!==""? parseInt(abb.durata) : null;
    const sogliaTemp = abb.tipo==="negativo" ? -18 : 3;
    const sogliaDurata = abb.tipo==="negativo" ? 240 : 110;
    const tempOk = temp!==null && (abb.tipo==="negativo"? temp<=sogliaTemp : temp<=sogliaTemp);
    const durataOk = durata!==null && durata<=sogliaDurata;
    abbattimento = { tipo: abb.tipo, temperatura: temp, durataMinuti: durata, conforme: !!(tempOk && durataOk) };
  }
  const rec = {
    id: uid(), ricettaId: recipeId, ricettaNome: r.nome,
    data: todayISO(), ora: nowTime(), operatore: op, note,
    abbattuto: !!abb.attivo, abbattimento,
    ingredientiUsati: window._componiIngredienti.map(x=>({...x}))
  };
  // Lotto interno del preparato + scheda P1 (tracciabilità a cascata)
  const giorniBase = r.giorniConservazione!==undefined ? r.giorniConservazione : 3;
  const giorniAbbattutoPositivo = r.giorniConservazioneAbbattuto!==undefined ? r.giorniConservazioneAbbattuto : giorniBase;
  const giorniAbbattutoNegativo = r.giorniConservazioneAbbattutoNegativo!==undefined ? r.giorniConservazioneAbbattutoNegativo : giorniAbbattutoPositivo;
  const giorni = abb.attivo ? (abb.tipo==="negativo"? giorniAbbattutoNegativo : giorniAbbattutoPositivo) : giorniBase;
  const oggi = todayISO();
  const progr = logs.produzione.filter(p=>p.semilavorato && p.ricettaId===recipeId && p.dataConsegna===oggi).length + 1;
  const lottoInterno = `PROD ${fmtDate(oggi)} · ${r.nome} · sett. ${isoWeekOfYear(oggi)} · L${String(progr).padStart(2,'0')}`;
  const qta = (document.getElementById("componiQta")||{}).value || "";
  const semilavorato = {
    id: uid(),
    prodotto: r.nome,
    lotto: lottoInterno,
    lottoStimato: false,
    semilavorato: true,
    composizioneId: rec.id,
    ricettaId: recipeId,
    quantita: qta.trim(),
    fornitore: "Produzione interna",
    ddt: "",
    dataConsegna: oggi,
    dataInizioProduzione: oggi,
    dataScadenza: addDaysISO(oggi, giorni),
    operatore: op,
    abbattuto: !!abb.attivo,
    abbattimento,
    origineLotti: rec.ingredientiUsati.map(i=>({
      ingrediente: i.ingrediente,
      lotto: i.lotto,
      fornitore: i.fornitore,
      produzioneId: i.produzioneId||null
    })),
    note: `Preparato internamente il ${fmtDate(oggi)} da ${op}. Conservazione ${giorni} giorni${abb.attivo? ' (prodotto abbattuto — '+(abb.tipo==="negativo"?"negativo":"positivo")+(abbattimento.temperatura!==null? ', '+abbattimento.temperatura+'°C':'')+(abbattimento.durataMinuti!==null? ' in '+abbattimento.durataMinuti+' min':'')+')' : ''}. Ingredienti: ${rec.ingredientiUsati.map(i=>`${i.ingrediente} (lotto ${i.lotto||'n/d'})`).join("; ")}.`,
    esaurito: false
  };
  rec.semilavoratoId = semilavorato.id;
  rec.lottoProdotto = lottoInterno;
  if(window._composizionePhoto){
    rec.photoKey = "photo-composizione-"+rec.id;
    DB.set(rec.photoKey, window._composizionePhoto, true).catch(()=>toast("⚠️ Errore di salvataggio foto"));
    window._composizionePhoto = null;
  }
  logs.produzione.push(semilavorato);
  saveLog("produzione").catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));

  // Lotti di partenza segnati come esauriti, se richiesto dall'operatore
  const daEsaurire = rec.ingredientiUsati.filter(i=>i.esaurisci && i.produzioneId);
  if(daEsaurire.length){
    daEsaurire.forEach(i=>{
      const src = logs.produzione.find(p=>p.id===i.produzioneId);
      if(src){ src.esaurito = true; src.dataEsaurimento = oggi; }
    });
    saveLog("produzione").catch(()=>{});
  }

  // Lotti PRECEDENTI della stessa ricetta selezionati come esauriti dall'operatore
  const idVecchiEsauriti = Object.keys(window._componiEsaurisciVecchi||{}).filter(id=>window._componiEsaurisciVecchi[id]);
  let numVecchiEsauriti = 0;
  if(idVecchiEsauriti.length){
    idVecchiEsauriti.forEach(id=>{
      const vecchio = logs.produzione.find(p=>p.id===id);
      if(vecchio && !vecchio.esaurito){ vecchio.esaurito = true; vecchio.dataEsaurimento = oggi; numVecchiEsauriti++; }
    });
    if(numVecchiEsauriti) saveLog("produzione").catch(()=>{});
  }
  window._componiEsaurisciVecchi = {};

  logs.composizioni.push(rec);
  activeTab="ricette"; closeSheet();
  const mancanti = rec.ingredientiUsati.filter(i=>!i.lotto).length;
  const avvisoAbb = abbattimento && !abbattimento.conforme ? " ⚠️ valori di abbattimento fuori soglia, da verificare" : "";
  const avvisoEsauriti = numVecchiEsauriti? ` · ${numVecchiEsauriti} lotto/i precedente/i segnato/i esaurito/i` : "";
  toast((mancanti? `Preparato registrato — ${mancanti} lotto/i inseriti a mano` : `Preparato registrato ✅ lotto interno creato`) + avvisoAbb + avvisoEsauriti);
  saveLog("composizioni").catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
  await saveOperator(op);
}

async function markComposizioneEsaurita(compId){
  const c = logs.composizioni.find(x=>x.id===compId);
  const semilavorato = logs.produzione.find(p=>p.id===c.semilavoratoId);
  if(!semilavorato){ toast("⚠️ Lotto collegato non trovato"); return; }
  const dataScelta = document.getElementById("compEsaurimento").value || todayISO();
  semilavorato.dataEsaurimento = dataScelta;
  semilavorato.esaurito = true;
  saveLog("produzione").catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
  toast(`Segnata come non più disponibile dal ${fmtDate(dataScelta)}`);
  activeTab="ricette"; closeSheet();
}
async function annullaComposizioneEsaurita(compId){
  const c = logs.composizioni.find(x=>x.id===compId);
  const semilavorato = logs.produzione.find(p=>p.id===c.semilavoratoId);
  if(!semilavorato){ toast("⚠️ Lotto collegato non trovato"); return; }
  if(!confirm("Segnare di nuovo questa preparazione come disponibile? Utile se la marcatura precedente era un errore.")) return;
  semilavorato.esaurito = false;
  delete semilavorato.dataEsaurimento;
  saveLog("produzione").catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
  toast("↩️ Segnata di nuovo come disponibile");
  activeTab="ricette"; closeSheet();
}
async function deleteComposizione(id){
  if(!isAdmin()){ toast("⛔ Solo l'amministratore può eliminare una registrazione già salvata"); return; }
  const rec = logs.composizioni.find(x=>x.id===id);
  logs.composizioni = logs.composizioni.filter(x=>x.id!==id);
  activeTab="ricette"; closeSheet();
  toast("Registrazione eliminata");
  if(rec && rec.photoKey){
    DB.delete(rec.photoKey, true).catch(()=>{});
  }
  saveLog("composizioni").catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
}

async function editCoai(id){

  c.zona = document.getElementById("cdZona").value.trim();

}
async function deleteCoai(id){

  toast("Controllo eliminato");

}
function allCoaiOk(c){ return COAI_ITEMS.every(i=>(c.checks||{})[i]==="assente"); }
function openCoaiForm(){
  openSheet("Nuovo controllo — COAI", `
    ${COAI_ITEMS.map(item=>`
      <div style="margin-bottom:10px;">
        <div style="font-weight:700;font-size:13px;margin-bottom:6px;">${item}</div>
        <div class="conforme-toggle" data-item="${item}">
          <button type="button" onclick="setCoaiCheck('${item.replace(/'/g,"\\'")}','assente',this)">Assente</button>
          <button type="button" onclick="setCoaiCheck('${item.replace(/'/g,"\\'")}','presente',this)">Presente</button>
        </div>
      </div>`).join("")}
    <label class="field">Zona (se presente qualcosa)</label><input type="text" id="coaiZona">
    <label class="field">Operatore</label><input type="text" id="coaiOp" value="${lastOperator}">

  `);
  window._coaiChecks = {};
}
function setCoaiCheck(item, val, btn){
  window._coaiChecks[item] = val;
  const group = btn.parentElement;
  [...group.children].forEach(b=>b.classList.remove("sel-ok","sel-bad"));
  btn.classList.add(val==="assente"?"sel-ok":"sel-bad");
}
async function saveCoai(){
  const zona = document.getElementById("coaiZona").value.trim();
  const op = document.getElementById("coaiOp").value.trim();
  const checks = window._coaiChecks||{};
  if(!op){ toast("Inserisci l'operatore"); return; }
  if(Object.keys(checks).length < COAI_ITEMS.length){ toast("Completa tutte le voci"); return; }
  const rec = {id:uid(), data:todayISO(), checks, zona, operatore:op};
  logs.coai.push(rec);
  saveLog("coai").catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
  saveOperator(op).catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
  toast(allCoaiOk(rec)? "Controllo registrato ✅" : "Registrato — presenza rilevata ⚠️");
  if(!allCoaiOk(rec)){
    const badItems = COAI_ITEMS.filter(i=>checks[i]==="presente").join(", ");
    prefillNoco("Controllo infestanti", `Rilevata presenza: ${badItems}. Zona: ${zona||'—'}.`, op);
    // NON chiudere qui: prefillNoco ha già aperto il modulo di non conformità da compilare e confermare.
  } else {
    closeSheet();
  }
}

function getMondayISO(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return toLocalISODate(d);
}
function renderTurni(){
  const me = getCurrentOperator();

    return toLocalISODate(d);

  const mieiTurni = me? turni.filter(t=>giorni.includes(t.data) && t.operatore===me.nome).sort((a,b)=>a.data.localeCompare(b.data)) : [];

  $main.innerHTML = `

      <h2>📅 I tuoi turni questa settimana</h2>

      ${mieiTurni.length? mieiTurni.map(t=>`
        <div class="logrow"><div>
          <div class="val">${giornoLbl(t.data)} ${fmtDate(t.data)}</div>

        <button class="iconbtn" onclick="cambiaSettimanaTurni(-1)">← Prec.</button>
        <button class="iconbtn" onclick="cambiaSettimanaTurni('reset')">Questa settimana</button>
        <button class="iconbtn" onclick="cambiaSettimanaTurni(1)">Succ. →</button>
      </div>
      ${giorni.map(g=>{
        const turniGiorno = turni.filter(t=>t.data===g).sort((a,b)=>(a.reparto+a.fascia).localeCompare(b.reparto+b.fascia));
        return `<h3>${giornoLbl(g)} ${fmtDate(g)}</h3>
        ${turniGiorno.length? turniGiorno.map(t=>`
          <div class="logrow">
            <div><div class="val">${t.operatore}${me && t.operatore===me.nome?' <span class="muted" style="font-size:11px;">(tu)</span>':''}</div>
            <div class="meta">${t.reparto} · ${fasciaLbl(t.fascia)}</div></div>

          </div>
        `).join("") : `<div class="empty" style="padding:6px 0;">Nessun turno assegnato.</div>`}
        `;
      }).join("")}
      ${isAdmin()? `<div class="rowbtns"><button class="btn secondary block" onclick="openAddTurnoForm('${giorni[0]}')">+ Aggiungi turno</button></div>`:''}
    </div>
  `;
}
function cambiaSettimanaTurni(delta){
  turniWeekOffset = delta==='reset'? 0 : turniWeekOffset+delta;
  render();
}
function openAddTurnoForm(defaultDate){

async function salvaTurno(){
  const data = document.getElementById("turnoData").value;
  const reparto = document.getElementById("turnoReparto").value;
  const fascia = document.getElementById("turnoFascia").value;
  const operatore = document.getElementById("turnoOperatore").value;
  if(!data){ toast("Scegli una data"); return; }
  if(!operatore){ toast("Scegli un operatore"); return; }
  if(!config.turni) config.turni = [];

  toast("Turno aggiunto");

async function eliminaTurno(id){
  config.turni = (config.turni||[]).filter(t=>t.id!==id);

  toast("Turno eliminato");

}

async function apriOrdineSettimanale(){
  if(getOrdineAperto()) { render(); return; } // già creato (es. da un altro dispositivo nel frattempo)
  const adesso = new Date();
  logs.ordini.push({id:uid(), data:todayISO(), operatoreApertura:lastOperator||"Sistema", righe:{}, stato:"aperto", creatoIl:adesso.toISOString(), scadenzaIl:new Date(adesso.getTime()+36*3600*1000).toISOString()});
  await saveLog("ordini");
  render();
}
// Legge una riga d'ordine in formato uniforme, gestendo anche il vecchio formato testo libero (retrocompatibilità)
function leggiRigaOrdine(val){
  if(val===undefined || val===null) return null;
  if(typeof val === "object") return val; // {qta, operatore}
  return {qta: val, operatore: null, legacy: true}; // vecchia registrazione a testo libero
}

function setOrdiniSearch(v){ ordiniSearchQuery = v; renderOrdiniList(); }
function renderOrdiniList(){
  // Ridisegna solo l'elenco articoli, per non far perdere il focus alla tastiera durante la ricerca
  const holder = document.querySelector("#main .card:nth-child(2)");
  if(holder) render(); // per semplicità e coerenza dei dati ridisegniamo tutta la vista
}
async function incrementaArticoloOrdine(articolo){
  const ordine = getOrdineAperto();
  if(!ordine) return;
  const attuale = leggiRigaOrdine(ordine.righe[articolo]);
  if(attuale && attuale.legacy){ toast("Questa voce ha una quantità a testo libero: eliminala e riaggiungila per usare il nuovo contatore."); return; }
  ordine.righe[articolo] = { qta: (attuale? attuale.qta : 0) + 1, operatore: lastOperator||"—" };
  await saveLog("ordini");
  renderOrdiniList();
}
async function decrementaArticoloOrdine(articolo){
  const ordine = getOrdineAperto();
  if(!ordine) return;
  const attuale = leggiRigaOrdine(ordine.righe[articolo]);
  if(!attuale || attuale.legacy) return;
  const nuovaQta = attuale.qta - 1;
  if(nuovaQta<=0) delete ordine.righe[articolo];
  else ordine.righe[articolo] = { qta: nuovaQta, operatore: lastOperator||attuale.operatore };
  await saveLog("ordini");
  renderOrdiniList();
}
async function toggleOrdinatoArticolo(articolo){
  if(!isAdmin()){ toast("⛔ Solo l'amministratore può farlo"); return; }
  const ordine = getOrdineAperto();
  if(!ordine) return;
  const riga = leggiRigaOrdine(ordine.righe[articolo]);
  if(!riga || riga.legacy) return;
  riga.ordinato = !riga.ordinato;
  ordine.righe[articolo] = riga;
  await saveLog("ordini");
  renderOrdiniList();
}
async function salvaOrdineCorrente(){
  const ordine = getOrdineAperto();
  if(!ordine) return;
  await saveLog("ordini");
  toast("💾 Ordine salvato");
}
async function eliminaArticoloOrdine(articolo){
  if(!isAdmin()){ toast("⛔ Solo l'amministratore può eliminare una voce dall'ordine"); return; }
  const ordine = getOrdineAperto();
  if(!ordine) return;
  if(!confirm(`Eliminare "${articolo}" dall'ordine?`)) return;
  delete ordine.righe[articolo];
  await saveLog("ordini");
  renderOrdiniList();
}
async function chiudiOrdineCorrente(){
  if(!isAdmin()){ toast("⛔ Solo l'amministratore può chiudere l'ordine settimanale"); return; }
  const ordine = getOrdineAperto();
  if(!ordine) return;
  const numRighe = Object.keys(ordine.righe).filter(k=>ordine.righe[k]).length;
  if(!numRighe){ toast("Aggiungi almeno un articolo prima di chiudere l'ordine"); return; }
  if(!confirm(`Chiudere l'ordine con ${numRighe} articolo/i e aprirne subito uno nuovo per la prossima settimana?`)) return;
  ordine.stato = "chiuso";
  ordine.operatoreChiusura = lastOperator;
  ordine.chiusoIl = new Date().toISOString();
  await saveLog("ordini");
  toast("✅ Ordine chiuso — ne apro subito uno nuovo");
  await apriOrdineSettimanale();
}
function openOrdineStorico(id){
  const o = logs.ordini.find(x=>x.id===id);
  if(!o) return;
  const righe = Object.entries(o.righe).filter(([,q])=>q).sort((a,b)=>a[0].localeCompare(b[0]));
  openSheet(`Ordine del ${fmtDate(o.data)}`, `
    <p class="muted">Aperto da ${o.operatoreApertura} · chiuso da ${o.operatoreChiusura||'—'} il ${o.chiusoIl? fmtDate(o.chiusoIl.slice(0,10)):'—'}</p>
    ${isAdmin()? `<p class="muted">👑 Tocca il nome di un articolo per evidenziarlo come "ordinato/ricevuto".</p>`:''}
    <div class="rowbtns">
      <button class="iconbtn" onclick="stampaOrdineStorico('${id}')">🖨️ Stampa</button>
      ${isAdmin()? `<button class="btn danger" onclick="eliminaOrdineStorico('${id}')">🗑️ Elimina dallo storico</button>`:''}
    </div>
    ${isAdmin()? `<div class="rowbtns"><button class="iconbtn block" onclick="openAddArticoloOrdineStorico('${id}')">+ Aggiungi articolo</button></div>`:''}
    <div id="ordineStoricoRighe">${ordineStoricoRigheHtml(id)}</div>
  `);
}
function ordineStoricoRigheHtml(id){
  const o = logs.ordini.find(x=>x.id===id);
  if(!o) return `<div class="empty">Ordine non trovato.</div>`;
  const righe = Object.entries(o.righe).filter(([,q])=>q).sort((a,b)=>a[0].localeCompare(b[0]));
  if(!righe.length) return `<div class="empty">Nessun articolo in questo ordine.</div>`;
  return righe.map(([art,val])=>{
    const r = leggiRigaOrdine(val);
    const artEsc = art.replace(/'/g,"\\'");
    const ordinato = !r.legacy && r.ordinato;
    return `<div class="logrow" style="${ordinato? 'background:var(--green-pale);':''}">
      <div style="flex:1;cursor:${isAdmin() && !r.legacy? 'pointer':'default'};${ordinato? 'text-decoration:line-through;':''}" ${isAdmin() && !r.legacy? `onclick="toggleOrdinatoArticoloStorico('${id}','${artEsc}')"` : ''}>
        <div class="val" style="font-size:13px;">${ordinato? '✅ ':''}${art}</div>
        ${isAdmin() && r.operatore? `<div class="meta" style="text-decoration:none;">aggiunto da ${r.operatore}</div>`:''}
      </div>
      <span class="chip ok">${r.qta}</span>
    </div>`;
  }).join("");
}
async function toggleOrdinatoArticoloStorico(id, articolo){
  if(!isAdmin()){ toast("⛔ Solo l'amministratore può farlo"); return; }
  const o = logs.ordini.find(x=>x.id===id);
  if(!o) return;
  const r = leggiRigaOrdine(o.righe[articolo]);
  if(!r || r.legacy) return;
  r.ordinato = !r.ordinato;
  o.righe[articolo] = r;
  await saveLog("ordini");
  const holder = document.getElementById("ordineStoricoRighe");
  if(holder) holder.innerHTML = ordineStoricoRigheHtml(id);
}
function openAddArticoloOrdineStorico(id){
  if(!isAdmin()){ toast("⛔ Solo l'amministratore può farlo"); return; }
  const listino = (config.ordiniListino||[]).slice().sort((a,b)=>a.localeCompare(b));
  openSheet("Aggiungi articolo all'ordine", `
    <label class="field">Articolo</label>

async function salvaArticoloOrdineStorico(id){
  const nome = document.getElementById("ordStoricoArtQuery").value.trim();
  const qta = parseInt(document.getElementById("ordStoricoArtQta").value,10) || 1;
  if(!nome){ toast("Inserisci il nome dell'articolo"); return; }
  const o = logs.ordini.find(x=>x.id===id);
  if(!o) return;
  const esistente = leggiRigaOrdine(o.righe[nome]);
  o.righe[nome] = { qta: (esistente && !esistente.legacy? esistente.qta : 0) + qta, operatore: lastOperator||"—" };
  await saveLog("ordini");
  toast(`✅ "${nome}" aggiunto all'ordine`);
  closeSheet();
  openOrdineStorico(id);

function stampaOrdineStorico(id){
  const o = logs.ordini.find(x=>x.id===id);
  if(!o) return;
  const righe = Object.entries(o.righe).filter(([,q])=>q).sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([art,val])=>{ const r = leggiRigaOrdine(val); return [esc(art), esc(r.qta), esc(r.operatore||'—')]; });
  const body = `<p>Aperto da ${esc(o.operatoreApertura)} il ${fmtDate(o.data)} · chiuso da ${esc(o.operatoreChiusura||'—')} il ${o.chiusoIl? fmtDate(o.chiusoIl.slice(0,10)):'—'}</p>` + tbl(["Articolo","Quantità","Aggiunto da"], righe);
  printWindow(`Ordine del ${fmtDate(o.data)}`, body);
}
async function eliminaOrdineStorico(id){
  if(!isAdmin()){ toast("⛔ Solo l'amministratore può farlo"); return; }
  if(!confirm("Eliminare definitivamente questo ordine dallo storico?")) return;
  logs.ordini = logs.ordini.filter(o=>o.id!==id);
  await saveLog("ordini");

async function saveNoco(){

  saveConfig().catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
  const rec = {id:uid(), verbale:config.nocoCounter, matrice, descrizione, data:todayISO(), redattoDa, stato:"aperta", azioneCorrettiva:"", efficacia:""};
  logs.noco.push(rec);
  saveLog("noco").catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));

  activeTab="noco"; closeSheet();

async function deleteNoco(id){

function openNocoClose(id){

async function closeNoco(id){

async function addSanifItem(freq){

  const name = document.getElementById("siName").value.trim();
  const reparto = document.getElementById("siReparto").value;
  if(!name){ toast("Inserisci una descrizione"); return; }
  if(!config.sanifItems[freq]) config.sanifItems[freq]=[];

  openSheet(`Modifica voce — ${freq}`, `

      <option value="" ${!config.sanifReparti[item]?'selected':''}>Nessuno</option>

    </select>
    <div class="rowbtns">
      <button class="btn block" onclick="editSanifItem('${freq}','${item.replace(/'/g,"\\'")}')">Salva modifiche</button>
      <button class="btn danger" onclick="deleteSanifItem('${freq}','${item.replace(/'/g,"\\'")}')">Elimina voce</button>
    </div>
  `);
}
async function editSanifItem(freq, oldItem){
  if(!isAdmin()){ toast("⛔ Solo l'amministratore può modificare le voci di sanificazione"); return; }
  const newName = document.getElementById("esiName").value.trim();
  const reparto = document.getElementById("esiReparto").value;
  if(!newName){ toast("Inserisci una descrizione"); return; }
  const idx = config.sanifItems[freq].indexOf(oldItem);
  if(idx>=0) config.sanifItems[freq][idx] = newName;
  if(!config.sanifReparti) config.sanifReparti = {};
  delete config.sanifReparti[oldItem];
  config.sanifReparti[newName] = reparto;
  saveConfig().catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
  logs.sanificazione.forEach(r=>{ if(r.frequenza===freq && r.item===oldItem) r.item = newName; });
  saveLog("sanificazione").catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
  toast("Voce aggiornata");
  activeTab = (activeTab==="sanificazione") ? "sanificazione" : "impostazioni";
  closeSheet();
}
async function deleteSanifItem(freq, item){
  if(!isAdmin()){ toast("⛔ Solo l'amministratore può eliminare voci di sanificazione"); return; }
  config.sanifItems[freq] = config.sanifItems[freq].filter(i=>i!==item);
  if(config.sanifReparti) delete config.sanifReparti[item];
  saveConfig().catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
  toast("Voce eliminata");
  activeTab = (activeTab==="sanificazione") ? "sanificazione" : "impostazioni";
  closeSheet();
}
// ---------- STAMPA SCHEDE ----------
function monthKeyNow(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function printWindow(title, bodyHtml){
  // Un iframe nascosto è molto più affidabile di window.open() su Safari/iPhone,
  // dove aprire una nuova finestra per la stampa causa spesso un errore "blob" e la pagina resta vuota.
  const vecchio = document.getElementById("printFrame");
  if(vecchio) vecchio.remove();
  const iframe = document.createElement("iframe");
  iframe.id = "printFrame";
  iframe.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden;";
  document.body.appendChild(iframe);
  const doc = iframe.contentWindow.document;
  const monthLbl = MONTHS[new Date().getMonth()] + " " + new Date().getFullYear();
  doc.open();
  doc.write(`<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><title>${title}</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;color:#222;margin:24px;font-size:12px;}
    h1{font-size:18px;margin:0 0 2px 0;}
    .sub{color:#666;font-size:11px;margin-bottom:14px;}
    h2{font-size:14px;margin:18px 0 6px 0;border-bottom:2px solid #1F6F4A;padding-bottom:3px;color:#155334;}
    table{width:100%;border-collapse:collapse;margin-bottom:12px;}
    th,td{border:1px solid #999;padding:4px 6px;text-align:left;font-size:11px;vertical-align:top;}
    th{background:#E4F1E9;color:#155334;}
    .ok{color:#1F6F4A;font-weight:bold;}
    .bad{color:#C0392B;font-weight:bold;}
    .empty{color:#888;font-style:italic;padding:8px 0;}
    .firma{margin-top:36px;display:flex;justify-content:space-between;gap:40px;}
    .firma div{flex:1;border-top:1px solid #222;padding-top:5px;font-size:11px;color:#444;}
  </style></head><body>
  <h1>🔥 Baldoria — Autocontrollo HACCP</h1>
  <div class="sub">${title} · Periodo: ${monthLbl} · Stampato il ${fmtDate(todayISO())} alle ${nowTime()}</div>
  ${bodyHtml}
  <div class="firma"><div>Firma dell'operatore</div><div>Firma del responsabile dell'autocontrollo</div></div>
  </body></html>`);
  doc.close();
  setTimeout(()=>{
    try{
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }catch(e){ toast("⚠️ Impossibile avviare la stampa, riprova"); }
  }, 400);
}
function esc(v){ return (v===undefined||v===null)? "—" : String(v).replace(/</g,"&lt;"); }
function tbl(headers, rows){
  if(!rows.length) return `<div class="empty">Nessuna registrazione nel mese corrente.</div>`;
  return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function raggruppaPerReparto(items, getReparto){
  const gruppi = {};
  items.forEach(it=>{
    const r = getReparto(it) || "Senza reparto";
    if(!gruppi[r]) gruppi[r] = [];
    gruppi[r].push(it);
  });
  const ordine = [...REPARTI, "Senza reparto"];
  return ordine.filter(r=>gruppi[r]).map(r=>({reparto:r, items:gruppi[r]}));
}
function buildSchedaContent(kind, mese){
  const mk = mese || monthKeyNow();
  const inMonth = r => (r.data||"").startsWith(mk);
  let title = "", body = "";
  if(kind==="temperature"){
    title = "Scheda temperature (MOTE)";
    const gruppi = raggruppaPerReparto(config.points, p=>p.reparto);
    body = gruppi.map(g=>{
      const sezione = g.items.map(p=>{
        const rows = logs.temperature.filter(r=>r.pointId===p.id && inMonth(r))
          .sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora))
          .map(r=> r.spento
            ? [fmtDate(r.data), r.ora, "🔌 OFF", esc(r.note)||"—", esc(r.operatore), "—"]
            : [fmtDate(r.data), r.ora, esc(r.valore)+" °C", r.conforme? `<span class="ok">Conforme</span>`:`<span class="bad">NON conforme</span>`, esc(r.operatore), r.fonte==="foto"?"📸 foto":"manuale"]);
        const rangeLbl = p.type==="freezer" ? `≤ ${p.max}°C` : `${p.min}°C / ${p.max}°C`;
        return `<h2>${esc(p.name)} — soglia ${rangeLbl}</h2>` + tbl(["Data","Ora","Valore","Esito","Operatore","Fonte"], rows);
      }).join("");
      return `<h1 style="margin-top:24px;border-bottom:3px solid #1F6F4A;padding-bottom:4px;">📍 Reparto: ${esc(g.reparto)}</h1>` + sezione;
    }).join("");
  } else if(kind==="sanificazione"){
    title = "Scheda sanificazione (MOSA)";
    body = ["giornaliera","settimanale","mensile"].map(freq=>{
      const itemsFreq = config.sanifItems[freq]||[];
      const gruppi = raggruppaPerReparto(itemsFreq, item=>config.sanifReparti[item]);
      const sezioneFreq = gruppi.map(g=>{
        const rows = logs.sanificazione.filter(r=>r.frequenza===freq && inMonth(r) && g.items.includes(r.item))
          .sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora))
          .map(r=>[fmtDate(r.data), r.ora, esc(r.item), esc(r.operatore)]);
        return `<h3>📍 ${esc(g.reparto)}</h3>` + tbl(["Data","Ora","Voce","Operatore"], rows);
      }).join("");
      return `<h2>Sanificazione ${freq}</h2>` + sezioneFreq;
    }).join("");
  } else if(kind==="moma"){
    title = "Controllo matrici in ingresso (MOMA)";
    const rows = logs.moma.filter(inMonth).sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora))
      .map(m=>[fmtDate(m.data), m.ora, esc(m.fornitore), esc(m.ddt),
        MOMA_CHECKS.map(c=>`${c.label}: ${m.checks[c.key]==="conforme"? `<span class="ok">C</span>`:`<span class="bad">NC</span>`}`).join("<br>"),
        esc(m.note), esc(m.operatore)]);
    body = tbl(["Data","Ora","Fornitore","DDT","Verifiche","Note","Operatore"], rows);
  } else if(kind==="produzione"){
    title = "Registro articoli e tracciabilità lotti (P1)";
    const attivi = logs.produzione.filter(p=>!p.esaurito);
    const rowsOf = list => list.sort((a,b)=>(a.dataScadenza||"").localeCompare(b.dataScadenza||""))
      .map(p=>[esc(p.prodotto), esc(p.lotto), esc(p.quantita), esc(p.fornitore), esc(p.ddt),
        p.dataConsegna? fmtDate(p.dataConsegna):"—", p.dataScadenza? fmtDate(p.dataScadenza):"—", esc(p.note)]);
    body = `<h2>Prodotti attivi</h2>` + tbl(["Prodotto","Lotto","Quantità","Fornitore","DDT","Consegna","Scadenza","Note"], rowsOf(attivi))
      + `<h2>Esauriti (mese corrente)</h2>` + tbl(["Prodotto","Lotto","Quantità","Fornitore","DDT","Consegna","Scadenza","Note"],
        rowsOf(logs.produzione.filter(p=>p.esaurito && (p.dataScadenza||"").startsWith(mk))));
  } else if(kind==="ricette"){
    title = "Ricette e composizioni";
    body = `<h2>Ricette base</h2>` + tbl(["Ricetta","Ingredienti"],
      (config.recipes||[]).map(r=>[esc(r.nome), (r.ingredienti||[]).map(i=>esc(i.nome||i)).join(", ")]))
      + `<h2>Composizioni registrate (mese corrente)</h2>` + tbl(["Data","Ora","Ricetta","Ingredienti / Lotti","Operatore","Note"],
        logs.composizioni.filter(inMonth).sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora))
          .map(c=>[fmtDate(c.data), c.ora, esc(c.ricettaNome),
            (c.ingredientiUsati||[]).map(i=>`${esc(i.nome)} (lotto: ${esc(i.lotto)||"—"})`).join("<br>"),
            esc(c.operatore), esc(c.note)]));
  } else if(kind==="coai"){
    title = "Controllo agenti infestanti (COAI)";
    const rows = logs.coai.filter(inMonth).sort((a,b)=>a.data.localeCompare(b.data))
      .map(c=>[fmtDate(c.data), esc(c.zona),
        Object.entries(c.checks||{}).map(([k,v])=>`${esc(k)}: ${v==="assente"? `<span class="ok">assente</span>`:`<span class="bad">PRESENZA</span>`}`).join("<br>"),
        esc(c.operatore)]);
    body = tbl(["Data","Zona","Verifiche","Operatore"], rows);
  } else if(kind==="noco"){
    title = "Verbali di non conformità (NOCO)";
    const rows = logs.noco.filter(inMonth).sort((a,b)=>a.data.localeCompare(b.data))
      .map(n=>[`N. ${n.verbale}`, fmtDate(n.data), esc(n.matrice), esc(n.descrizione),
        esc(n.azioneCorrettiva), esc(n.efficacia),
        n.stato==="aperta"? `<span class="bad">APERTA</span>`:`<span class="ok">CHIUSA</span>`, esc(n.redattoDa)]);
    body = tbl(["Verbale","Data","Matrice/Oggetto","Descrizione","Azione correttiva","Verifica efficacia","Stato","Redatto da"], rows);
  } else if(kind==="ordini"){
    title = "Ordine fornitore";
    const ordine = logs.ordini.find(o=>o.stato==="aperto");
    if(!ordine){
      body = `<div class="empty">Nessun ordine aperto al momento.</div>`;
    } else {
      const righe = Object.entries(ordine.righe).filter(([,q])=>q).sort((a,b)=>a[0].localeCompare(b[0]))
        .map(([art,val])=>{ const r = leggiRigaOrdine(val); return [esc(art), esc(r.qta), esc(r.operatore||'—')]; });
      body = `<p>Ordine aperto da ${esc(ordine.operatoreApertura)} il ${fmtDate(ordine.data)}</p>` + tbl(["Articolo","Quantità","Aggiunto da"], righe);
    }
  }
  return {title, body};
}
function printScheda(kind, mese){

}
// I download basati su blob: URL falliscono spesso su Safari/iPhone (errore "WebKitBlobResource").
// Un data: URI è molto più affidabile per attivare il download di un file.
function triggerDataDownload(filename, content, mime){
  const dataUri = "data:" + mime + ";charset=utf-8," + encodeURIComponent(content);
  const a = document.createElement("a");
  a.href = dataUri;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ---------- FASCICOLO COMPLETO PER ISPEZIONE ----------
function schedaBody(kind){
  const mk = monthKeyNow();
  const inMonth = r => (r.data||"").startsWith(mk);
  if(kind==="temperature"){
    return config.points.map(p=>{
      const rows = logs.temperature.filter(r=>r.pointId===p.id && inMonth(r))
        .sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora))
        .map(r=> r.spento
          ? [fmtDate(r.data), r.ora, "🔌 OFF", esc(r.note)||"—", esc(r.operatore), "—"]
          : [fmtDate(r.data), r.ora, esc(r.valore)+" °C", r.conforme? `<span class="ok">Conforme</span>`:`<span class="bad">NON conforme</span>`, esc(r.operatore), r.fonte==="foto"?"foto":"manuale"]);
      const rangeLbl = p.type==="freezer" ? `≤ ${p.max}°C` : p.type==="hot" ? `≥ ${p.min}°C` : `${p.min}°C / ${p.max}°C`;
      return `<h2>${esc(p.name)} — soglia ${rangeLbl}</h2>` + tbl(["Data","Ora","Valore","Esito","Operatore","Fonte"], rows);
    }).join("");
  }
  if(kind==="sanificazione"){
    return ["giornaliera","settimanale","mensile"].map(freq=>{
      const rows = logs.sanificazione.filter(r=>r.frequenza===freq && inMonth(r))
        .sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora))
        .map(r=>[fmtDate(r.data), r.ora, esc(r.item), esc(r.operatore)]);
      return `<h2>Sanificazione ${freq}</h2>` + tbl(["Data","Ora","Voce","Operatore"], rows);
    }).join("");
  }
  if(kind==="moma"){
    const rows = logs.moma.filter(inMonth).sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora))
      .map(m=>[fmtDate(m.data), m.ora, esc(m.fornitore), esc(m.ddt),
        MOMA_CHECKS.map(c=>`${c.label}: ${m.checks[c.key]==="conforme"? `<span class="ok">C</span>`:`<span class="bad">NC</span>`}`).join("<br>"),
        esc(m.note), esc(m.operatore)]);
    return tbl(["Data","Ora","Fornitore","DDT","Verifiche","Note","Operatore"], rows);
  }
  if(kind==="produzione"){
    const rowsOf = list => list.sort((a,b)=>(a.dataScadenza||"").localeCompare(b.dataScadenza||""))
      .map(p=>[esc(p.prodotto), esc(p.lotto)+(p.lottoStimato?" *":""), esc(p.quantita), esc(p.fornitore), esc(p.ddt),
        p.dataConsegna? fmtDate(p.dataConsegna):"—", p.dataScadenza? fmtDate(p.dataScadenza):"—"]);
    const head = ["Prodotto","Lotto","Quantità","Fornitore","DDT","Consegna","Scadenza"];
    return `<h2>Prodotti attivi</h2>` + tbl(head, rowsOf(logs.produzione.filter(p=>!p.esaurito)))
      + `<h2>Esauriti (mese corrente)</h2>` + tbl(head, rowsOf(logs.produzione.filter(p=>p.esaurito && (p.dataScadenza||"").startsWith(mk))))
      + `<div style="font-size:10px;color:#666;">* lotto non riportato in bolla: tracciabilità garantita da numero e data di emissione del DDT e settimana dell'anno.</div>`;
  }
  if(kind==="ricette"){
    return `<h2>Ricette base</h2>` + tbl(["Ricetta","Ingredienti"],
      (config.recipes||[]).map(r=>[esc(r.nome), (r.ingredienti||[]).map(i=>esc(i.nome||i)).join(", ")]))
      + `<h2>Composizioni registrate</h2>` + tbl(["Data","Ora","Ricetta","Ingredienti / Lotti","Operatore"],
        logs.composizioni.filter(inMonth).sort((a,b)=>(a.data+a.ora).localeCompare(b.data+b.ora))
          .map(c=>[fmtDate(c.data), c.ora, esc(c.ricettaNome),
            (c.ingredientiUsati||[]).map(i=>`${esc(i.nome||i.ingrediente)} (lotto: ${esc(i.lotto)||"—"})`).join("<br>"),
            esc(c.operatore)]));
  }
  if(kind==="coai"){
    return tbl(["Data","Zona","Verifiche","Operatore"],
      logs.coai.filter(inMonth).sort((a,b)=>a.data.localeCompare(b.data))
        .map(c=>[fmtDate(c.data), esc(c.zona),
          Object.entries(c.checks||{}).map(([k,v])=>`${esc(k)}: ${v==="assente"? `<span class="ok">assente</span>`:`<span class="bad">PRESENZA</span>`}`).join("<br>"),
          esc(c.operatore)]));
  }
  if(kind==="noco"){
    return tbl(["Verbale","Data","Matrice/Oggetto","Descrizione","Azione correttiva","Verifica efficacia","Stato","Redatto da"],
      logs.noco.filter(inMonth).sort((a,b)=>a.data.localeCompare(b.data))
        .map(n=>[`N. ${n.verbale}`, fmtDate(n.data), esc(n.matrice), esc(n.descrizione),
          esc(n.azioneCorrettiva), esc(n.efficacia),
          n.stato==="aperta"? `<span class="bad">APERTA</span>`:`<span class="ok">CHIUSA</span>`, esc(n.redattoDa)]));
  }
  return "";
}
function printFascicolo(){
  const mk = monthKeyNow();
  const inMonth = r => (r.data||"").startsWith(mk);
  const temps = logs.temperature.filter(inMonth);
  const tempNC = temps.filter(r=>!r.spento && !r.conforme);
  const sanif = logs.sanificazione.filter(inMonth);
  const momaM = logs.moma.filter(inMonth);
  const momaNC = momaM.filter(m=>MOMA_CHECKS.some(c=>m.checks[c.key]==="non_conforme"));
  const coaiM = logs.coai.filter(inMonth);
  const coaiNC = coaiM.filter(c=>Object.values(c.checks||{}).some(v=>v!=="assente"));
  const nocoM = logs.noco.filter(inMonth);
  const nocoAperte = nocoM.filter(n=>n.stato==="aperta");
  const pct = temps.length ? Math.round((temps.length-tempNC.length)/temps.length*100) : null;
  const lottiStimati = logs.produzione.filter(p=>p.lottoStimato && !p.esaurito).length;

  const riepilogo = `
  <h2>Riepilogo del periodo</h2>

    <thead><tr><th>Registro</th><th>Registrazioni</th><th>Esito</th></tr></thead>

      <tr><td>Temperature (MOTE)</td><td>${temps.length}</td>

      <tr><td>Sanificazione (MOSA)</td><td>${sanif.length}</td><td>${sanif.length? `<span class="ok">registrate con foto di conferma</span>`:"—"}</td></tr>
      <tr><td>Matrici in ingresso (MOMA)</td><td>${momaM.length}</td>
        <td>${momaNC.length? `<span class="bad">${momaNC.length} consegne con anomalie</span>`:`<span class="ok">tutte conformi</span>`}</td></tr>
      <tr><td>Agenti infestanti (COAI)</td><td>${coaiM.length}</td>
        <td>${coaiNC.length? `<span class="bad">${coaiNC.length} controlli con presenze</span>`:`<span class="ok">nessuna presenza rilevata</span>`}</td></tr>
      <tr><td>Prodotti tracciati (P1)</td><td>${logs.produzione.filter(p=>!p.esaurito).length} attivi</td>
        <td>${lottiStimati? `${lottiStimati} con lotto derivato dal DDT`:`<span class="ok">tutti con lotto di fornitura</span>`}</td></tr>
      <tr><td>Non conformità (NOCO)</td><td>${nocoM.length}</td>
        <td>${nocoAperte.length? `<span class="bad">${nocoAperte.length} ancora aperte</span>`:`<span class="ok">tutte chiuse</span>`}</td></tr>
    </tbody>
  </table>
  ${nocoAperte.length? `<div style="font-size:11px;color:#C0392B;margin-bottom:10px;">Attenzione: risultano verbali di non conformità ancora aperti. Verificare l'efficacia delle azioni correttive prima dell'archiviazione.</div>`:""}`;

  const sezioni = [
    ["Registro temperature (MOTE)","temperature"],
    ["Registro sanificazione (MOSA)","sanificazione"],
    ["Controllo matrici in ingresso (MOMA)","moma"],
    ["Articoli e tracciabilità lotti (P1)","produzione"],
    ["Ricette e composizioni","ricette"],
    ["Controllo agenti infestanti (COAI)","coai"],
    ["Verbali di non conformità (NOCO)","noco"]
  ].map(([titolo,kind])=>`<div style="page-break-before:always;"><h1 style="font-size:15px;margin:0 0 10px 0;">${titolo}</h1>${schedaBody(kind)}</div>`).join("");

  printWindow("Fascicolo di autocontrollo — documentazione completa", riepilogo + sezioni);
}
// Stampa scheda mensile a griglia — temperatura di un punto
function printTempMese(pointId){
  const p = config.points.find(x=>x.id===pointId);
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const rangeLbl = p.type==="freezer" ? `≤ ${p.max}°C` : `${p.min}°C / ${p.max}°C`;
  let rows = "";
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const recs = logs.temperature.filter(r=>r.pointId===pointId && r.data===iso);
    if(recs.length){
      const last = recs[recs.length-1];
      if(last.spento){
        rows += `<tr><td>${d}</td><td>🔌 OFF</td>
          <td>${last.ora}</td><td>${esc(last.operatore)}</td>
          <td>${esc(last.note)||'—'}</td></tr>`;
      } else {
        rows += `<tr><td>${d}</td><td class="${last.conforme?'ok':'bad'}">${last.valore}°C</td>
          <td>${last.ora}</td><td>${esc(last.operatore)}</td>
          <td>${last.conforme? `<span class="ok">Conforme</span>`:`<span class="bad">NON conforme</span>`}</td></tr>`;
      }
    } else {
      rows += `<tr><td>${d}</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>`;
    }
  }
  printWindow(`Scheda mensile temperature — ${p.name}`,
    `<h2>${esc(p.name)} — soglia di conformità: ${rangeLbl}</h2>
    <table><thead><tr><th>Giorno</th><th>Valore</th><th>Ora</th><th>Operatore</th><th>Esito</th></tr></thead>
    <tbody>${rows}</tbody></table>`);
}
// Stampa scheda mensile a griglia — sanificazione per frequenza
function sanifItemGridHtml(freq, item){
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  let rows = "";
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = logs.sanificazione.find(r=>r.item===item && r.frequenza===freq && r.data===iso);
    if(rec){
      rows += `<tr><td>${d}</td><td class="ok">✓</td><td>${rec.ora}</td><td>${esc(rec.operatore)}</td></tr>`;
    } else {
      rows += `<tr><td>${d}</td><td>—</td><td>—</td><td>—</td></tr>`;
    }
  }
  return `<h2>${esc(item)} — sanificazione ${freq}</h2>
    <table><thead><tr><th>Giorno</th><th>Eseguita</th><th>Ora</th><th>Operatore</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}
function printSanifItemMese(freq, item){
  printWindow(`Scheda mensile sanificazione ${freq} — ${item}`, sanifItemGridHtml(freq, item));
}
function printSanifMese(freq){
  const items = config.sanifItems[freq]||[];
  if(!items.length){ toast("Nessuna voce configurata"); return; }
  printWindow(`Scheda mensile sanificazione — ${freq}`, items.map(item=>sanifItemGridHtml(freq, item)).join(""));
}

function filieraHtml(prodId, livello){
  const p = logs.produzione.find(x=>x.id===prodId);
  if(!p || livello > 5) return "";
  const pad = livello * 16;
  const head = `<div style="margin-left:${pad}px;padding:7px 9px;border-left:3px solid ${p.semilavorato? '#E1A100':'#1F6F4A'};margin-bottom:5px;background:#fafafa;">
    <b>${p.semilavorato? '🏷️':'📦'} ${esc(p.prodotto)}</b><br>
    <span style="font-size:11px;color:#555;">Lotto: ${esc(p.lotto)} · ${p.semilavorato? 'preparato il '+fmtDate(p.dataConsegna)+' da '+esc(p.operatore) : 'da '+esc(p.fornitore)+(p.ddt? ', DDT '+esc(p.ddt):'')+' del '+fmtDate(p.dataConsegna)}</span>
  </div>`;
  const figli = (p.origineLotti||[]).map(o=>{
    if(o.produzioneId) return filieraHtml(o.produzioneId, livello+1);
    return `<div style="margin-left:${pad+16}px;padding:7px 9px;border-left:3px solid #bbb;margin-bottom:5px;background:#fafafa;">
      <b>📦 ${esc(o.ingrediente)}</b><br><span style="font-size:11px;color:#555;">Lotto: ${esc(o.lotto)||'non tracciato'}${o.fornitore? ' · '+esc(o.fornitore):''}</span></div>`;
  }).join("");
  return head + figli;
}

async function saveDbConfig(){
  const url = document.getElementById("dbUrl").value.trim();
  const key = document.getElementById("dbKey").value.trim();
  const res = document.getElementById("dbTestResult");
  if(!url || !key){ toast("Inserisci URL e chiave"); return; }
  res.innerHTML = `<p class="muted"><span class="spinner"></span> Verifica connessione...</p>`;
  const t = await DB.test(url, key).catch(()=>({ok:false, msg:"Impossibile raggiungere il database."}));
  if(!t.ok){ res.innerHTML = `<p style="color:var(--red);font-size:13px;">❌ ${t.msg}</p>`; return; }
  dbConfig = {url, key, proxy: !!window._dbProxy};
  LS.set(DBCFG_KEY, JSON.stringify(dbConfig));
  res.innerHTML = `<p style="color:var(--green);font-size:13px;">✅ Connessione riuscita.</p>`;
  toast("Database collegato");
  await loadAll();
  activeTab="impostazioni"; closeSheet();
}
async function clearDbConfig(){
  if(!confirm("Disconnettere il database? I dati restano sul database, ma l'app tornerà all'archivio locale.")) return;
  LS.remove(DBCFG_KEY);
  dbConfig = null;
  await loadAll();
  toast("Database disconnesso");
  activeTab="impostazioni"; closeSheet();
}
async function migraDati(){
  if(!confirm("Copiare configurazione e registri attualmente caricati sul database? I dati già presenti sul database con le stesse chiavi verranno sovrascritti.")) return;
  toast("Copia in corso...");
  try{
    await DB.set("config", JSON.stringify(config), true);
    for(const k of ["temperature","sanificazione","moma","coai","noco","produzione","composizioni","ordini"]){
      await DB.set("log-"+k, JSON.stringify(logs[k]), true);
    }
    toast("✅ Registri copiati sul database");
  }catch(e){ toast("⚠️ Copia non riuscita: "+e.message); }
}

// ---------- BACKUP AUTOMATICO ----------
const BACKUP_PREFIX = "backup:";
function buildFullSnapshot(){
  return { generatedAt: new Date().toISOString(), config, logs };
}
async function runAutoBackupIfDue(){
  if(DB.mode!=="supabase") return; // ha senso solo con database condiviso: in locale i dati sono già solo qui
  // Non creare MAI un backup se config o un registro non si sono caricati correttamente:
  // salveremmo per sempre uno snapshot vuoto/corrotto al posto di uno buono per la giornata.
  if(Object.values(loadFailures).some(v=>v)) return;
  const key = BACKUP_PREFIX + todayISO();
  try{
    await DB.get(key, true);
    return; // esiste già il backup di oggi
  }catch(e){ /* non esiste ancora: lo creiamo sotto */ }
  try{
    await DB.set(key, JSON.stringify(buildFullSnapshot()), true);
    pruneOldBackups().catch(()=>{});
  }catch(err){ /* si ritenterà al prossimo avvio dell'app */ }
}
async function pruneOldBackups(){
  const list = await DB.list(BACKUP_PREFIX, true);
  const keys = (list.keys||[]).filter(k=>k.startsWith(BACKUP_PREFIX)).sort();
  const LIMIT = 30;
  if(keys.length > LIMIT){
    for(const k of keys.slice(0, keys.length - LIMIT)){ await DB.delete(k, true).catch(()=>{}); }
  }
}
function triggerJsonDownload(filename, dataStr){
  triggerDataDownload(filename, dataStr, "application/json");
}
function downloadFullBackupNow(){
  triggerJsonDownload(`haccp-baldoria-backup-${todayISO()}.json`, JSON.stringify(buildFullSnapshot(), null, 2));
  toast("💾 Backup scaricato");
}
async function downloadBackupSnapshot(key){
  try{
    const r = await DB.get(key, true);
    triggerJsonDownload(key.replace(":","-")+".json", r.value);
    toast("💾 Backup scaricato");
  }catch(e){ toast("⚠️ Impossibile scaricare questo backup"); }
}
function openRestoreBackupForm(){
  window._restoreData = null;
  openSheet("♻️ Ripristina da backup", `
    <div class="card" style="padding:11px;background:var(--amber-pale);border:none;">
      <p class="muted" style="margin:0;font-size:13px;"><b>Attenzione:</b> questa operazione sostituisce TUTTA la configurazione e TUTTI i registri attuali con quelli contenuti nel file caricato. Usala solo per recuperare da un problema — non è normalmente necessaria, e non si può annullare (a meno di ripristinare un altro backup).</p>
    </div>
    <label class="field">File di backup (.json, scaricato in precedenza da questa stessa sezione)</label>
    <input type="file" accept="application/json" id="restoreFileInput">
    <div id="restorePreview" style="margin-top:8px;"></div>
    <div class="rowbtns"><button class="btn danger block" id="restoreConfirmBtn" disabled onclick="eseguiRipristino()">Ripristina questi dati (sovrascrive tutto)</button></div>
  `, ()=>{
    document.getElementById("restoreFileInput").onchange = (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        const previewEl = document.getElementById("restorePreview");
        const btnEl = document.getElementById("restoreConfirmBtn");
        try{
          const data = JSON.parse(reader.result);
          if(!data.config && !data.logs){ throw new Error("formato non riconosciuto"); }
          window._restoreData = data;
          const nPoints = (data.config && data.config.points || []).length;
          const nSanifG = (data.config && data.config.sanifItems && data.config.sanifItems.giornaliera || []).length;
          const nSanifS = (data.config && data.config.sanifItems && data.config.sanifItems.settimanale || []).length;
          previewEl.innerHTML = `<p class="muted" style="font-size:13px;">✅ File letto correttamente — generato il ${data.generatedAt? fmtDate(data.generatedAt.slice(0,10)):'?'}.<br>Contiene: <b>${nPoints}</b> punti di controllo temperatura, <b>${nSanifG}</b> voci di sanificazione giornaliera, <b>${nSanifS}</b> settimanali.</p>`;
          btnEl.disabled = false;
        }catch(err){
          previewEl.innerHTML = `<p style="color:var(--red);font-size:13px;">⚠️ File non valido o corrotto — impossibile leggerlo.</p>`;
          window._restoreData = null;
          btnEl.disabled = true;
        }
      };
      reader.readAsText(file);
    };
  });
}
async function eseguiRipristino(){
  const data = window._restoreData;
  if(!data){ toast("Nessun file valido caricato"); return; }
  if(!confirm("Sei sicuro? Questo SOSTITUISCE tutti i dati attuali (configurazione e registri) con quelli del file di backup. L'operazione non è reversibile.")) return;
  try{
    if(data.config){
      config = data.config;
      loadFailures.config = false; // stiamo scrivendo consapevolmente, sblocchiamo il salvataggio
      await saveConfig();
    }
    if(data.logs){
      for(const key of Object.keys(data.logs)){
        if(logs.hasOwnProperty(key)){
          logs[key] = data.logs[key] || [];
          loadFailures[key] = false;
          await saveLog(key);
        }
      }
    }
    migrateReparti();
    toast("✅ Ripristino completato con successo");
    window._restoreData = null;
    activeTab = "impostazioni"; closeSheet();
    render();
  }catch(err){
    toast("⚠️ Errore durante il ripristino: "+(err.message||"riprova"));
  }
}
function openBackupPanel(){
  openSheet("💾 Backup e Ripristino", `
    <div class="card" style="padding:11px;background:var(--green-pale);border:none;">
      <div style="font-weight:800;font-size:13px;">Backup automatico giornaliero</div>
      <p class="muted" style="font-size:12px;margin-top:4px;">Ogni giorno, alla prima apertura dell'app, viene salvata una copia completa di tutti i registri. Le ultime 30 copie vengono conservate.</p>
    </div>
    <h2 style="margin-top:16px;">Backup automatici disponibili</h2>
    <div id="backupListEl"><span class="spinner"></span> Carico...</div>
  `, async ()=>{
    const el = document.getElementById("backupListEl");
    try{
      const list = await DB.list(BACKUP_PREFIX, true);
      const keys = (list.keys||[]).filter(k=>k.startsWith(BACKUP_PREFIX)).sort().reverse().slice(0,14);
      el.innerHTML = keys.length? keys.map(k=>`
        <div class="logrow">
          <div><div class="val">${fmtDate(k.replace(BACKUP_PREFIX,""))}</div></div>
          <span class="muted" style="cursor:pointer;text-decoration:underline;" onclick="downloadBackupSnapshot('${k}')">⬇️ Scarica</span>
        </div>
      `).join("") : `<div class="empty">Nessun backup automatico ancora disponibile (se ne crea uno ogni giorno).</div>`;
    }catch(e){
      el.innerHTML = `<div class="empty">Impossibile caricare l'elenco (controlla la connessione).</div>`;
    }
  });
}

function exportCsv(kind){
  const rows = logs[kind];
  if(!rows.length){ toast("Nessun dato da esportare"); return; }
  const keys = Array.from(new Set(rows.flatMap(r=>Object.keys(flatten(r)))));
  const lines = [keys.join(";")];
  rows.forEach(r=>{
    const flat = flatten(r);
    lines.push(keys.map(k=>JSON.stringify(flat[k]!==undefined?flat[k]:"")).join(";"));
  });
  triggerDataDownload(`haccp_${kind}_${todayISO()}.csv`, lines.join("\n"), "text/csv");
}
function flatten(obj, prefix=""){
  let out = {};
  for(const k in obj){
    if(typeof obj[k]==="object" && obj[k]!==null && !Array.isArray(obj[k])){
      Object.assign(out, flatten(obj[k], prefix+k+"."));
    } else {
      out[prefix+k] = obj[k];
    }
  }
  return out;
}

// ---------- INIT ----------
function openOfflineInfo(){
  const n = pendingSyncCount();
  const q = getPendingQueue();
  const elenco = Object.keys(q).map(k=>{
    const nomi = {
      "log-temperature":"Temperature", "log-sanificazione":"Sanificazione", "log-moma":"MOMA",
      "log-coai":"Infestanti (COAI)", "log-noco":"Non conformità (NOCO)", "log-produzione":"Articoli/Lotti",
      "log-composizioni":"Ricette/Composizioni", "config":"Configurazione ricette/punti"
    };
    return `<div class="logrow"><div><div class="val">${nomi[k]||k}</div><div class="meta">In attesa dal ${fmtDate(new Date(q[k].ts).toISOString().slice(0,10))}</div></div></div>`;
  }).join("");
  openSheet("📡 Sincronizzazione", `
    <p class="muted">${n>0
      ? `Ci sono <b>${n}</b> modific${n===1?'a':'he'} salvat${n===1?'a':'e'} su questo dispositivo, in attesa di raggiungere il database condiviso. Nessun dato è stato perso: appena torna la connessione, l'app li invia da sola in automatico.`
      : `Tutto sincronizzato — nessuna modifica in attesa.`}</p>
    ${elenco}
    ${n>0? `<div class="rowbtns"><button class="btn block" onclick="flushPendingSync().then(()=>{closeSheet();toast('🔄 Sincronizzazione tentata');})">🔄 Riprova ora</button></div>`:""}
  `);
}
const APP_VERSION = "91";
async function checkForNewVersion(silentReloadIfChanged){
  try{
    const url = location.href.split("?")[0].split("#")[0] + "?_v=" + Date.now();
    const r = await fetch(url, {cache:"no-store"});
    if(!r.ok) return;
    const text = await r.text();
    const m = text.match(/versione (\d+) ·/);
    if(m && m[1] !== APP_VERSION){
      if(silentReloadIfChanged){
        toast("🔄 Aggiornamento alla versione più recente...");
        setTimeout(()=>{ location.reload(); }, 700);
      } else {
        showUpdateBanner(m[1]);
      }
    }
  }catch(e){ /* rete assente: si riprova al prossimo controllo, nessun problema */ }
}
function showUpdateBanner(nuovaVersione){
  if(document.getElementById("updateBanner")) return;
  const b = document.createElement("div");
  b.id = "updateBanner";
  b.style.cssText = "position:fixed;bottom:0;left:0;right:0;background:var(--green-dark);color:#fff;padding:14px 16px;text-align:center;font-weight:800;font-size:14px;z-index:9999;cursor:pointer;box-shadow:0 -2px 10px rgba(0,0,0,.2);";
  b.textContent = `🔄 Nuova versione (${nuovaVersione}) disponibile — tocca per aggiornare`;
  b.onclick = ()=>{ location.reload(); };
  document.body.appendChild(b);
}
function proceedToApp(){
  render();
  window.__avviata = true;
  updateOfflineBadge();
  if(DB.mode==="local" && !LS.available){
    setTimeout(()=>toast("⚠️ Questo browser non salva i dati: apri l'app da un indirizzo web, non dal file"), 1200);
  } else if(DB.mode==="local"){
    setTimeout(()=>toast("📱 Dati salvati solo su questo dispositivo — configurali in Impostazioni"), 1200);
  }
  if(pendingSyncCount()>0) setTimeout(()=>toast(`📡 ${pendingSyncCount()} modifica/he in attesa di sincronizzazione`), 1200);
  setInterval(tickTimers, 1000);
  setInterval(pollTimersFromStorage, 10000);
  setInterval(pollAuditsFromStorage, 10000);
  setInterval(flushPendingSync, 20000);
  setInterval(()=>checkForNewVersion(false), 5*60*1000); // ogni 5 minuti mentre l'app resta aperta: banner discreto
  document.addEventListener("visibilitychange", ()=>{
    if(!document.hidden) checkForNewVersion(true); // riapertura app: aggiorna da sola, senza chiedere
  });
  window.addEventListener("online", ()=>{ toast("🌐 Connessione ripristinata, sincronizzo..."); flushPendingSync(); });
  runAutoBackupIfDue();
}
(async function init(){
  try{
    $main.innerHTML = `<div class="empty"><span class="spinner"></span> Caricamento registri...</div>`;
    await loadAll();
    migrateReparti();
    const sessId = LS.get(SESSION_KEY);
    const sessOp = sessId ? (config.operatori||[]).find(o=>o.id===sessId) : null;
    if(sessOp && sessOp.attivo){
      currentOperatorId = sessOp.id;
      lastOperator = sessOp.nome;
      proceedToApp();
    } else {
      if(sessId) LS.remove(SESSION_KEY);
      renderLoginGate();
    }
  }catch(err){
    fatalError("Si è verificato un errore durante il caricamento dei registri.", err && (err.stack||err.message));
  }
})();
