<style>

  .card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}

  .ac-opt{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;margin-bottom:7px;

<div id="app">
  <header class="top">
    <div class="row1">
      <div>
        <h1>🔥 Baldoria — Autocontrollo HACCP</h1>
        <div class="sub" style="opacity:.85;">versione 91 · storico ordini + countdown rosso · 12/08/2026</div>
        <div class="sub" id="todayLabel"></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div id="offlineBadge" onclick="openOfflineInfo()" style="display:none;align-items:center;gap:5px;background:rgba(255,255,255,.18);
          border-radius:10px;padding:9px 10px;font-size:13px;cursor:pointer;font-weight:700;">

        </div>
        <button id="settingsBtn" style="background:rgba(255,255,255,.18);border:none;color:#fff;

  </header>
  <main id="main"><div class="empty" style="padding:24px;text-align:center;color:#6B6155;">Caricamento…</div></main>
  <noscript><div style="padding:20px;font-family:sans-serif;">Per usare il registro HACCP occorre attivare JavaScript nelle impostazioni del browser.</div></noscript>

<script>
// ---------- COMPATIBILITÀ E DIAGNOSTICA ----------
if(typeof structuredClone !== "function"){
  window.structuredClone = o => JSON.parse(JSON.stringify(o));
}
// Safari blocca localStorage con file:// o cookie disattivati: mai lasciarlo esplodere
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
  remove(k){ try{ localStorage.removeItem(k); }catch(e){} },
  keys(){ try{ return Object.keys(localStorage); }catch(e){ return []; } },
  get available(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } }
};
function fatalError(msg, dettaglio){
  const el = document.getElementById("main") || document.body;
  el.innerHTML = `<div style="padding:18px;font-family:system-ui,-apple-system,sans-serif;">
    <h2 style="color:#C0392B;font-size:16px;">Errore di avvio</h2>
    <p style="font-size:14px;line-height:1.45;">${msg}</p>
    ${dettaglio? `<pre style="background:#f2f2f2;padding:10px;border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-word;">${String(dettaglio).slice(0,600)}</pre>`:""}
    <p style="font-size:13px;color:#666;">Riprova a ricaricare la pagina. Se il problema resta, riferisci il testo qui sopra.</p>
  </div>`;
}
window.addEventListener("error", e=>{
  if(document.getElementById("main") && !document.getElementById("main").innerHTML.trim()){
    fatalError("L'app non è riuscita ad avviarsi su questo dispositivo.", e.message);
  }
});

// Sentinella: se dopo 5 secondi la pagina è ancora vuota, mostra la diagnosi
window.__avviata = false;
window.addEventListener("load", function(){
  setTimeout(function(){
    var m = document.getElementById("main");
    if(!window.__avviata && m && !m.innerHTML.trim()){
      fatalError("L'app non è partita su questo dispositivo. Probabilmente il browser è troppo datato per eseguire il codice.",
        "Browser: " + navigator.userAgent + "\nSalvataggio disponibile: " + (LS.available ? "sì" : "no"));
    }
  }, 5000);
});
</script>
<script>

const ANTHROPIC_MODEL = "claude-sonnet-4-6";

// ================= LIVELLO DATI =================
// L'app funziona in tre modalità:
//  claude   → dentro l'artefatto Claude (window.storage)
//  supabase → autonoma, dati condivisi su database esterno
//  local    → ripiego sul singolo dispositivo (memoria del browser)
const DBCFG_KEY = "haccp-baldoria-dbconfig";
let dbConfig = null;
try{ dbConfig = JSON.parse(LS.get(DBCFG_KEY) || "null"); }catch(e){ dbConfig = null; }
// Configurazione di default: se il dispositivo non ha ancora nulla salvato, si collega
// automaticamente al database condiviso di Baldoria, senza bisogno di inserirla a mano.
if(!dbConfig){
  dbConfig = { url: "https://eoxainopyovzeytngyce.supabase.co", key: "sb_publishable_PmcLucG1cpSukhiU4dd66Q_sSA-2p4g", proxy: true };
  LS.set(DBCFG_KEY, JSON.stringify(dbConfig));
}

const DB = {
  get mode(){
    if(dbConfig && dbConfig.url && dbConfig.key) return "supabase";
    if(typeof window.storage !== "undefined" && window.storage) return "claude";
    return "local";
  },
  _headers(){
    return {
      "apikey": dbConfig.key,
      "Authorization": "Bearer " + dbConfig.key,
      "Content-Type": "application/json"
    };
  },
  _url(path){ return dbConfig.url.replace(/\/+$/,"") + "/rest/v1/haccp_kv" + path; },

  async get(key, shared){
    if(this.mode==="claude") return window.storage.get(key, shared);
    if(this.mode==="local"){
      const v = LS.get("haccp:"+key);
      if(v===null) throw new Error("not found");
      return {key, value:v, shared:true};
    }
    // Modalità offline: se c'è una modifica locale non ancora sincronizzata per questa chiave,
    // è più recente di quella sul server — la usiamo direttamente, senza aspettare la rete.
    const pending = getPendingSync(key);
    if(pending) return {key, value: pending.value, shared:true};
    const r = await fetch(this._url(`?key=eq.${encodeURIComponent(key)}&select=value`), {headers:this._headers()});
    if(!r.ok) throw new Error("db get "+r.status);
    const rows = await r.json();
    if(!rows.length) throw new Error("not found");
    return {key, value: rows[0].value, shared:true};
  },
  async set(key, value, shared){
    if(this.mode==="claude") return window.storage.set(key, value, shared);
    if(this.mode==="local"){
      if(!LS.set("haccp:"+key, value)) throw new Error("memoria del browser non disponibile");
      return {key, value, shared:true};
    }
    try{
      const r = await fetch(this._url(""), {
        method:"POST",
        headers:{...this._headers(), "Prefer":"resolution=merge-duplicates,return=minimal"},
        body: JSON.stringify({key, value, updated_at:new Date().toISOString()})
      });
      if(!r.ok) throw new Error("db set "+r.status);
      clearPendingSync(key);
      return {key, value, shared:true};
    }catch(err){
      // Rete assente o Supabase irraggiungibile: il dato NON si perde, resta in coda
      // sul dispositivo e riparte da solo appena torna la connessione.
      queuePendingSync(key, value);
      return {key, value, shared:true, offline:true};
    }
  },
  async delete(key, shared){
    if(this.mode==="claude") return window.storage.delete(key, shared);
    if(this.mode==="local"){ LS.remove("haccp:"+key); return {key, deleted:true}; }
    const r = await fetch(this._url(`?key=eq.${encodeURIComponent(key)}`), {method:"DELETE", headers:this._headers()});
    if(!r.ok) throw new Error("db delete "+r.status);
    return {key, deleted:true, shared:true};
  },
  async list(prefix, shared){
    if(this.mode==="claude") return window.storage.list(prefix, shared);
    if(this.mode==="local"){
      const keys = LS.keys().filter(k=>k.startsWith("haccp:"+(prefix||""))).map(k=>k.slice(6));
      return {keys, prefix, shared:true};
    }
    const r = await fetch(this._url(`?key=like.${encodeURIComponent((prefix||"")+"*")}&select=key`), {headers:this._headers()});
    if(!r.ok) throw new Error("db list "+r.status);
    return {keys:(await r.json()).map(x=>x.key), prefix, shared:true};
  },
  async test(url, key){
    const r = await fetch(url.replace(/\/+$/,"") + "/rest/v1/haccp_kv?select=key&limit=1", {
      headers:{"apikey":key, "Authorization":"Bearer "+key}
    });
    if(r.ok) return {ok:true};
    if(r.status===404) return {ok:false, msg:"Tabella haccp_kv non trovata: esegui prima lo script SQL."};
    if(r.status===401) return {ok:false, msg:"Chiave non valida o permessi mancanti."};
    return {ok:false, msg:"Errore di connessione ("+r.status+")."};
  }
};

// ---------- MODALITÀ OFFLINE: coda di sincronizzazione locale ----------
// Se una registrazione non riesce a raggiungere il database condiviso (rete assente,
// Supabase irraggiungibile), resta salvata qui sul dispositivo e riparte da sola.
const PENDING_SYNC_KEY = "haccp-baldoria-pending-sync";
function getPendingQueue(){
  try{ return JSON.parse(LS.get(PENDING_SYNC_KEY) || "{}"); }catch(e){ return {}; }
}
function setPendingQueue(q){ LS.set(PENDING_SYNC_KEY, JSON.stringify(q)); }
function getPendingSync(key){ const q = getPendingQueue(); return q[key] || null; }
function queuePendingSync(key, value){
  const q = getPendingQueue();
  q[key] = { value, ts: Date.now() };
  setPendingQueue(q);
  updateOfflineBadge();
}
function clearPendingSync(key){
  const q = getPendingQueue();
  if(q[key]){ delete q[key]; setPendingQueue(q); updateOfflineBadge(); }
}
function pendingSyncCount(){ return Object.keys(getPendingQueue()).length; }
async function flushPendingSync(){
  if(DB.mode!=="supabase") return;
  const q = getPendingQueue();
  const keys = Object.keys(q);
  if(!keys.length) return;
  for(const key of keys){
    const item = q[key];
    try{
      const r = await fetch(DB._url(""), {
        method:"POST",
        headers:{...DB._headers(), "Prefer":"resolution=merge-duplicates,return=minimal"},
        body: JSON.stringify({key, value:item.value, updated_at:new Date().toISOString()})
      });
      if(r.ok) clearPendingSync(key);
    }catch(e){ /* rete ancora assente: resta in coda, si riprova al prossimo giro */ }
  }
  // Se la coda si è svuotata, i dati appena sincronizzati potrebbero differire da quelli
  // in memoria su altri dispositivi: un ricaricamento leggero mantiene tutto coerente.
  if(!pendingSyncCount() && window.__avviata){
    loadAll().then(()=>{ if($overlay.innerHTML.trim()==="") render(); }).catch(()=>{});
  }
}
function updateOfflineBadge(){
  const n = pendingSyncCount();
  const el = document.getElementById("offlineBadge");
  if(!el) return;
  if(n>0){
    el.style.display = "flex";
    el.querySelector("#offlineBadgeCount").textContent = n;
  } else {
    el.style.display = "none";
  }
}

function dbModeLabel(){
  return DB.mode==="supabase" ? "☁️ Database condiviso" :
         DB.mode==="claude"   ? "💬 Archivio Claude" :
                                "📱 Solo questo dispositivo";
}

// Vero solo se la lettura AI di Claude è disponibile (dentro l'artefatto, o fuori con proxy configurato)
function canUseClaudeAI(){
  return DB.mode==="claude" || (DB.mode==="supabase" && !!dbConfig.proxy);
}

// ---------- OCR GRATUITO DI RIPIEGO (Tesseract.js) ----------
// Usato quando la lettura AI di Claude non è disponibile: gira nel browser, nessun costo, nessuna chiave.
let _tesseractLoading = null;
function ensureTesseractLoaded(){
  if(typeof Tesseract !== "undefined") return Promise.resolve();
  if(_tesseractLoading) return _tesseractLoading;
  _tesseractLoading = new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error("Impossibile caricare il modulo di lettura testo (serve connessione internet)"));
    document.head.appendChild(s);
  });
  return _tesseractLoading;
}
async function runOcr(dataUrl, onProgress){
  await ensureTesseractLoaded();
  const worker = await Tesseract.createWorker("ita+eng", 1, {
    logger: onProgress ? (msg)=>{
      if(msg.status==="recognizing text") onProgress(Math.round((msg.progress||0)*100));
    } : undefined
  });
  try{
    const { data } = await worker.recognize(dataUrl);
    return (data && data.text || "").trim();
  } finally {
    worker.terminate().catch(()=>{});
  }
}
// Estrae dal testo OCR grezzo il primo numero plausibile come temperatura
function guessTemperatureFromText(text){
  const matches = (text.match(/-?\d{1,3}[.,]\d/g) || text.match(/-?\d{1,3}(?=\s*°)/g) || []);
  if(!matches.length) return null;
  const val = parseFloat(matches[0].replace(",", "."));
  return isNaN(val) ? null : val;
}

// Chiamate AI: dentro Claude vanno dirette, fuori passano dal proxy sicuro
async function aiRequest(payload){
  if(DB.mode==="supabase" && dbConfig.proxy){
    const r = await fetch(dbConfig.url.replace(/\/+$/,"") + "/functions/v1/claude-proxy", {
      method:"POST",
      headers:{"Content-Type":"application/json", "Authorization":"Bearer "+dbConfig.key},
      body: JSON.stringify(payload)
    });
    if(!r.ok) throw new Error("proxy "+r.status);
    return r.json();
  }
  if(DB.mode==="supabase" && !dbConfig.proxy){
    throw new Error("no-ai");
  }
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)
  });
  return r.json();
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toLocalISODate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayISO(){ return toLocalISODate(new Date()); }
// Per la sola Sanificazione: tra mezzanotte e le 4:00 del mattino, la registrazione
// si riferisce ancora alla giornata precedente (chi chiude dopo mezzanotte sta
// completando le pulizie di IERI, non iniziando quelle di oggi).
function sanifDateISO(){
  const now = new Date();
  if(now.getHours() < 4){
    const y = new Date(now);
    y.setDate(y.getDate()-1);
    return toLocalISODate(y);
  }
  return toLocalISODate(now);
}
function isoWeekOfYear(isoDate){
  const d = new Date(isoDate+"T00:00:00");
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay()+6)%7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = new Date(target.getFullYear(),0,4);
  const fdayNr = (firstThursday.getDay()+6)%7;
  firstThursday.setDate(firstThursday.getDate() - fdayNr + 3);
  return 1 + Math.round((target - firstThursday)/(7*86400000));
}
function nowTime(){ return new Date().toTimeString().slice(0,5); }
function fmtDate(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric"});
}

// Traccia, per ogni tipo di dato, se l'ultimo caricamento è fallito per un VERO problema
// (rete, server) invece che per assenza legittima del dato (prima installazione).
// Se è fallito per un problema reale, blocchiamo i salvataggi finché non si ricarica con successo:
// altrimenti rischieremmo di sovrascrivere dati veri con un config/registro vuoto.
let loadFailures = {};
async function loadAll(){
  try{
    const c = await DB.get("config", true);
    config = c ? JSON.parse(c.value) : structuredClone(DEFAULT_CONFIG);
    loadFailures.config = false;
  }catch(e){
    config = structuredClone(DEFAULT_CONFIG);
    loadFailures.config = !(e && e.message==="not found"); // "not found" = prima volta, è normale
  }

  for(const key of ["temperature","sanificazione","moma","coai","noco","produzione","composizioni","ordini"]){
    try{
      const r = await DB.get("log-"+key, true);
      logs[key] = r ? JSON.parse(r.value) : [];
      loadFailures[key] = false;
    }catch(e){
      logs[key] = [];
      loadFailures[key] = !(e && e.message==="not found");
    }
  }
  const problemi = Object.keys(loadFailures).filter(k=>loadFailures[k]);
  if(problemi.length){
    setTimeout(()=>toast(`⚠️ Alcuni dati non si sono caricati correttamente (${problemi.join(", ")}) — le modifiche a queste sezioni sono bloccate finché non ricarichi la pagina con connessione attiva, per non rischiare di perdere dati.`), 1500);
  }
  // L'ultimo operatore usato resta legato a QUESTO dispositivo (localStorage puro),
  // non va condiviso tra dispositivi/operatori diversi.
  lastOperator = LS.get("ui-last-operator-device") || "";
  await loadTimers();
  await loadAudits();
}
async function saveConfig(){
  if(loadFailures.config){
    toast("⚠️ Salvataggio bloccato: la configurazione non è stata caricata correttamente. Ricarica la pagina prima di modificare.");
    throw new Error("blocco di sicurezza: config non caricata correttamente");
  }
  await DB.set("config", JSON.stringify(config), true);
}
async function saveLog(key){
  if(loadFailures[key]){
    toast(`⚠️ Salvataggio bloccato: il registro "${key}" non è stato caricato correttamente. Ricarica la pagina prima di modificare.`);
    throw new Error("blocco di sicurezza: log non caricato correttamente");
  }
  await DB.set("log-"+key, JSON.stringify(logs[key]), true);
}

const SESSION_KEY = "haccp-baldoria-sessione-operatore";
let currentOperatorId = null;
function getCurrentOperator(){
  if(!currentOperatorId) return null;
  return (config.operatori||[]).find(o=>o.id===currentOperatorId) || null;
}
function isAdmin(){
  const op = getCurrentOperator();
  return !!(op && op.ruolo==="admin");
}
// Reparti a cui l'operatore attuale ha accesso. Array vuoto = nessuna restrizione (vede tutto).
function mieiReparti(){
  const op = getCurrentOperator();
  if(!op || isAdmin()) return [];
  return op.reparti||[];
}
// Un elemento con reparto "itemReparto" è visibile all'operatore attuale?
// Admin e operatori senza restrizioni vedono tutto; elementi senza reparto assegnato sono sempre visibili.
function hasRepartoAccess(itemReparto){
  const miei = mieiReparti();
  if(!miei.length) return true;
  if(!itemReparto) return true;
  return miei.includes(itemReparto);
}
// Per elementi con più reparti assegnati (es. le ricette): visibile se l'operatore
// ha accesso ad ALMENO UNO dei reparti dell'elemento (o se non ne ha nessuno).
function hasAnyRepartoAccess(repartiArr){
  if(!repartiArr || !repartiArr.length) return true;
  const miei = mieiReparti();
  if(!miei.length) return true;
  return repartiArr.some(r=>miei.includes(r));
}

async function creaPrimoAdmin(){
  const nome = document.getElementById("setupNome").value.trim();
  const pin = document.getElementById("setupPin").value.trim();
  const pinConferma = document.getElementById("setupPinConferma").value.trim();
  const errEl = document.getElementById("setupError");
  if(!nome){ errEl.textContent = "Inserisci il tuo nome."; return; }
  if(!/^\d{4,6}$/.test(pin)){ errEl.textContent = "Il PIN deve avere da 4 a 6 cifre numeriche."; return; }
  if(pin!==pinConferma){ errEl.textContent = "I due PIN inseriti non coincidono."; return; }
  const id = uid();
  config.operatori = [{id, nome, pin, ruolo:"admin", attivo:true}];
  await saveConfig();
  LS.set(SESSION_KEY, id);
  currentOperatorId = id;
  lastOperator = nome;
  LS.set("ui-last-operator-device", nome);
  toast(`Benvenuto, ${nome}! Sei l'amministratore.`);
  proceedToApp();
}
function tentaLogin(){
  const pin = document.getElementById("loginPin").value.trim();
  const errEl = document.getElementById("loginError");
  const op = (config.operatori||[]).find(o=>o.pin===pin);
  if(!op){ errEl.textContent = "PIN non riconosciuto."; return; }
  if(!op.attivo){ errEl.textContent = "Accesso bloccato per questo operatore. Contatta l'amministratore."; return; }
  LS.set(SESSION_KEY, op.id);
  currentOperatorId = op.id;
  lastOperator = op.nome;
  LS.set("ui-last-operator-device", op.nome);
  toast(`Bentornato, ${op.nome}!`);
  proceedToApp();
}
function cambiaOperatore(){
  if(!confirm("Uscire e tornare alla schermata di accesso? Dovrai reinserire il PIN.")) return;
  LS.remove(SESSION_KEY);
  currentOperatorId = null;

async function loadTimers(){

    timers = r ? JSON.parse(r.value) : [];
  }catch(e){ timers = []; }
}
async function saveTimers(){

}
function fmtCountdown(ms){
  if(ms<0) ms=0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  if(h>0) return `${h}h ${String(m).padStart(2,'0')}m`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function timerFor(targetKey){
  return timers.find(t=>t.targetKey===targetKey);
}
function openTimerForm(kind, targetKey, label){
  const existing = timerFor(targetKey);
  openSheet(`⏱️ Timer — ${label}`, `
    ${existing? `<p class="muted">Timer attivo, scade alle ${new Date(existing.endTime).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}.</p>
      <div class="rowbtns"><button class="btn danger block" onclick="cancelTimer('${targetKey}')">Annulla timer</button></div>
      <h3>Sostituisci con un nuovo timer</h3>` : ""}
    <div class="rowbtns" style="margin-top:6px;">
      <button class="btn secondary" onclick="startTimer('${kind}','${targetKey}','${label.replace(/'/g,"\\'")}',15)">15 min</button>
      <button class="btn secondary" onclick="startTimer('${kind}','${targetKey}','${label.replace(/'/g,"\\'")}',30)">30 min</button>
      <button class="btn secondary" onclick="startTimer('${kind}','${targetKey}','${label.replace(/'/g,"\\'")}',60)">1 ora</button>
      <button class="btn secondary" onclick="startTimer('${kind}','${targetKey}','${label.replace(/'/g,"\\'")}',120)">2 ore</button>

async function startTimer(kind, targetKey, label, minutes){

function startTimerCustom(kind, targetKey, label){

// ---------- ROLLOVER GIORNO ----------
function getMondayOfWeek(d){
  const day = d.getDay(); // 0=Dom,1=Lun...6=Sab
  const diff = (day===0? -6 : 1-day);
  const monday = new Date(d);
  monday.setDate(d.getDate()+diff);
  return toLocalISODate(monday);
}
function checkDateRollover(){
  const cur = todayISO();
  if(window._lastKnownDate===undefined) window._lastKnownDate = cur;
  if(cur !== window._lastKnownDate){
    window._lastKnownDate = cur;
    toast("📅 Nuovo giorno — schede aggiornate: "+fmtDate(cur));
    render();
  }
}

// ---------- CONTROLLI HACCP AUTOMATICI (avviso + allarme, NON legati ai timer) ----------
// audits: { daily: null|{noticeAt, escalated, missing}, weekly: ..., monthly: ... }
let audits = { daily: null, weekly: null, monthly: null };
let sirenAudioNode = null;
async function loadAudits(){
  try{ const r = await DB.get("audits", true); audits = r? JSON.parse(r.value) : {daily:null, weekly:null, monthly:null}; }
  catch(e){ audits = {daily:null, weekly:null, monthly:null}; }
}
async function saveAudits(){
  try{ await DB.set("audits", JSON.stringify(audits), true); }
  catch(e){ toast("⚠️ Errore di salvataggio controlli"); }
}
function auditMissingDaily(){
  const t = todayISO();
  const tSanif = sanifDateISO();
  const missingTemp = config.points.filter(p=>!logs.temperature.some(r=>r.pointId===p.id && r.data===t));
  const missingSanif = (config.sanifItems.giornaliera||[]).filter(item=>!logs.sanificazione.some(r=>r.item===item && r.frequenza==='giornaliera' && r.data===tSanif));
  return {missingTemp: missingTemp.map(p=>p.id), missingSanif, missingTempLabels: missingTemp.map(p=>p.name), missingTempReparti: missingTemp.map(p=>p.reparto||""), missingSanifReparti: missingSanif.map(item=>config.sanifReparti[item]||"")};
}
function auditMissingWeekly(){
  const mondayISO = getMondayOfWeek(new Date());
  const missingSanif = (config.sanifItems.settimanale||[]).filter(item=>!logs.sanificazione.some(r=>r.item===item && r.frequenza==='settimanale' && r.data>=mondayISO));
  const missingCoai = !logs.coai.some(c=>c.data>=mondayISO);
  return {missingSanif, missingCoai, missingSanifReparti: missingSanif.map(item=>config.sanifReparti[item]||"")};
}
function auditMissingMonthly(){
  const now = new Date();
  const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const missingSanif = (config.sanifItems.mensile||[]).filter(item=>!logs.sanificazione.some(r=>r.item===item && r.frequenza==='mensile' && r.data.slice(0,7)===monthKey));
  return {missingSanif, missingSanifReparti: missingSanif.map(item=>config.sanifReparti[item]||"")};
}
function auditIsEmpty(type, missing){
  if(type==='daily') return missing.missingTemp.length===0 && missing.missingSanif.length===0;
  if(type==='weekly') return missing.missingSanif.length===0 && !missing.missingCoai;
  return missing.missingSanif.length===0; // monthly
}
function auditComputeMissing(type){
  if(type==='daily') return auditMissingDaily();
  if(type==='weekly') return auditMissingWeekly();
  return auditMissingMonthly();
}
function auditNoticeLabel(type, missing){
  const miei = mieiReparti(); // [] per admin o operatori senza restrizioni: vedono tutto
  const filtra = (lista, reparti) => miei.length? lista.filter((_,i)=> !reparti[i] || miei.includes(reparti[i])) : lista;
  const parts = [];
  if(type==='daily'){
    const templabels = filtra(missing.missingTempLabels, missing.missingTempReparti||[]);
    const sanifItems = filtra(missing.missingSanif, missing.missingSanifReparti||[]);
    if(templabels.length) parts.push(`Temperature non registrate: ${templabels.join(', ')}`);
    if(sanifItems.length) parts.push(`Sanificazioni giornaliere non fatte: ${sanifItems.join(', ')}`);
  } else if(type==='weekly'){
    const sanifItems = filtra(missing.missingSanif, missing.missingSanifReparti||[]);
    if(sanifItems.length) parts.push(`Sanificazioni settimanali non fatte: ${sanifItems.join(', ')}`);
    if(missing.missingCoai && isAdmin()) parts.push(`Controllo infestanti (COAI) non ancora fatto questa settimana`);
  } else {
    const sanifItems = filtra(missing.missingSanif, missing.missingSanifReparti||[]);
    if(sanifItems.length) parts.push(`Sanificazioni mensili non fatte: ${sanifItems.join(', ')}`);
  }
  return parts.join(' · ');
}
function triggerAuditCheck(type){
  const missing = auditComputeMissing(type);
  if(auditIsEmpty(type, missing)){
    audits[type] = null; // esito positivo: nulla da segnalare, si passa oltre
    saveAudits().catch(()=>{});
    return;
  }
  audits[type] = { noticeAt: Date.now(), escalated:false, missing };
  saveAudits().catch(()=>{});
  const labels = {daily:"Controllo ore 11:30", weekly:"Controllo settimanale (giovedì 11:00)", monthly:"Controllo mensile (15 del mese ore 12:00)"};
  toast(`⚠️ ${labels[type]}: verifiche mancanti`);
  render();
}
function recheckActiveAudits(){
  let changed = false;
  ['daily','weekly','monthly'].forEach(type=>{
    const a = audits[type];
    if(!a) return;
    const missing = auditComputeMissing(type);
    if(auditIsEmpty(type, missing)){
      audits[type] = null; // risolto: esito positivo, si chiude senza allarme
      changed = true;
    } else {
      a.missing = missing;
      if(!a.escalated && (Date.now()-a.noticeAt >= 30*60*1000)){
        a.escalated = true;
        changed = true;
      }
    }
  });
  if(changed){ saveAudits().catch(()=>{}); render(); }
  updateSirenState();
}
function anyAuditEscalated(){
  return ['daily','weekly','monthly'].some(t=>audits[t] && audits[t].escalated);
}
function anyAuditActive(){
  return ['daily','weekly','monthly'].some(t=>audits[t]);
}
function updateSirenState(){
  if(window._sirenMuted) return;
  if(anyAuditEscalated()) startSirenSound(); else stopSirenSound();
}
function muteSiren(){
  window._sirenMuted = true;
  stopSirenSound();
  toast("🔇 Suono silenziato — le voci mancanti restano evidenziate finché non le completi");
}
function startSirenSound(){
  if(sirenAudioNode) return;
  try{
    const ctx = window._alarmCtx || (window._alarmCtx = new (window.AudioContext||window.webkitAudioContext)());
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sawtooth";
    gain.gain.value = 0.15;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    let dir = 1, freq = 500;
    const sweep = setInterval(()=>{
      freq += dir*40;
      if(freq>=1000){ freq=1000; dir=-1; }
      if(freq<=500){ freq=500; dir=1; }
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
    }, 60);
    sirenAudioNode = {osc, sweep};
  }catch(e){}
}
function stopSirenSound(){
  if(sirenAudioNode){
    try{ clearInterval(sirenAudioNode.sweep); sirenAudioNode.osc.stop(); }catch(e){}
    sirenAudioNode = null;
  }
}
// helper per evidenziare in UI i singoli elementi mancanti
function pointAuditStatus(pointId){
  for(const type of ['daily']){
    const a = audits[type];
    if(a && a.missing.missingTemp && a.missing.missingTemp.includes(pointId)) return a.escalated? 'escalated':'notice';
  }
  return null;
}
function sanifAuditStatus(freq, item){
  const type = freq==='giornaliera' ? 'daily' : freq==='settimanale' ? 'weekly' : 'monthly';
  const a = audits[type];
  if(a && a.missing.missingSanif && a.missing.missingSanif.includes(item)) return a.escalated? 'escalated':'notice';
  return null;
}
function coaiAuditStatus(){
  const a = audits.weekly;
  if(a && a.missing.missingCoai) return a.escalated? 'escalated':'notice';
  return null;
}
function auditBannerHtml(){
  if(!anyAuditActive()) return "";
  const items = ['daily','weekly','monthly'].filter(t=>audits[t]).map(t=>{
    const a = audits[t];
    const label = t==='daily'?'Giornaliero':t==='weekly'?'Settimanale':'Mensile';
    const testo = auditNoticeLabel(t, a.missing);
    if(!testo) return ""; // dopo il filtro per reparto, questo tipo non riguarda l'operatore attuale
    return `<div style="font-size:12px;">${a.escalated?'🚨':'⚠️'} <b>${label}:</b> ${testo}</div>`;
  }).join("");
  if(!items) return ""; // nulla di rilevante per il reparto dell'operatore attuale
  return `<div class="card" style="border:2px solid var(--red);background:var(--red-pale);">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="color:var(--red);margin:0;">🔍 Controlli HACCP in sospeso</h2>
      ${anyAuditEscalated() && isAdmin()? `<button class="iconbtn" onclick="muteSiren()">🔇 Silenzia</button>` : ""}
    </div>
    ${items}
  </div>`;
}

function checkScheduledAudits(){
  const now = new Date();
  const todayKey = todayISO();
  if(now.getHours()===11 && now.getMinutes()===0 && window._lastTempReminder!==todayKey){
    window._lastTempReminder = todayKey;
    triggerTemperatureReminder();
  }
  if(now.getHours()===11 && now.getMinutes()===30 && window._lastDailyTrigger!==todayKey){
    window._lastDailyTrigger = todayKey;
    triggerAuditCheck('daily');
  }
  if(now.getDay()===4 && now.getHours()===11 && now.getMinutes()===0 && window._lastWeeklyTrigger!==todayKey){
    window._lastWeeklyTrigger = todayKey;
    triggerAuditCheck('weekly');
  }
  if(now.getDate()===15 && now.getHours()===12 && now.getMinutes()===0 && window._lastMonthlyTrigger!==todayKey){
    window._lastMonthlyTrigger = todayKey;
    triggerAuditCheck('monthly');
  }
  recheckActiveAudits();
}
function triggerTemperatureReminder(){
  const {missingTemp, missingTempLabels} = auditMissingDaily();
  if(missingTemp.length===0) return; // già tutte fatte, nessun promemoria necessario
  toast(`🌡️ Ore 11:00 — ricordati di rilevare le temperature: ${missingTempLabels.join(', ')}`);
}

function tickTimers(){
  checkDateRollover();
  checkScheduledAudits();
  // aggiorna i badge visibili senza ridisegnare tutto
  document.querySelectorAll("[data-timer-key]").forEach(el=>{
    const key = el.getAttribute("data-timer-key");
    const t = timerFor(key);
    if(t) el.textContent = `⏱️ ${fmtCountdown(t.endTime-Date.now())}`;
  });
  document.querySelectorAll("[data-countdown-until]").forEach(el=>{
    const until = parseInt(el.getAttribute("data-countdown-until"),10);
    const rimanenti = until - Date.now();
    el.textContent = rimanenti>0 ? `⏳ Mancano ${fmtCountdown(rimanenti)} alla chiusura ordine` : `⏰ Tempo scaduto — l'ordine dovrebbe essere chiuso`;
    el.style.color = "var(--red)";
  });
  // controlla scadenze
  const now = Date.now();
  timers.forEach(t=>{
    if(t.endTime<=now && !ringingTimers.find(r=>r.id===t.id)){
      ringingTimers.push(t);
    }
  });
  if(ringingTimers.length>0){
    startAlarmSound();
    renderAlarmOverlay();
  }
}
async function pollTimersFromStorage(){
  const before = timers.map(t=>t.id).sort().join(",");
  await loadTimers();
  const after = timers.map(t=>t.id).sort().join(",");
  // rimuovi da ringingTimers quelli non più presenti (annullati da altro dispositivo)
  ringingTimers = ringingTimers.filter(rt=>timers.find(t=>t.id===rt.id));
  if(ringingTimers.length===0){
    stopAlarmSound();
    if(window._alarmShowing){ window._alarmShowing=false; $overlay.innerHTML=""; render(); }
  }
  if(before!==after && $overlay.innerHTML.trim()==="") render();
}
async function pollAuditsFromStorage(){
  // Ricarica anche i registri usati per calcolare i controlli mancanti (temperature, sanificazione, COAI),
  // altrimenti l'allarme resta bloccato sui dati vecchi rimasti in memoria su questo dispositivo,
  // anche quando un ALTRO dispositivo ha già registrato il controllo mancante.
  try{
    const [rTemp, rSanif, rCoai] = await Promise.all([
      DB.get("log-temperature", true).catch(()=>null),
      DB.get("log-sanificazione", true).catch(()=>null),
      DB.get("log-coai", true).catch(()=>null),
    ]);
    if(rTemp) logs.temperature = JSON.parse(rTemp.value);
    if(rSanif) logs.sanificazione = JSON.parse(rSanif.value);
    if(rCoai) logs.coai = JSON.parse(rCoai.value);
  }catch(e){ /* silenzioso: se fallisce, il prossimo giro riprova */ }

  const wasEscalated = {daily: !!(audits.daily&&audits.daily.escalated), weekly: !!(audits.weekly&&audits.weekly.escalated), monthly: !!(audits.monthly&&audits.monthly.escalated)};
  const before = JSON.stringify(audits);
  await loadAudits();
  recheckActiveAudits(); // ricalcola subito con i dati freschi appena caricati, e salva/pulisce se risolto
  const after = JSON.stringify(audits);
  if(before!==after){
    const newlyEscalated = ['daily','weekly','monthly'].some(t=> !wasEscalated[t] && audits[t] && audits[t].escalated);
    if(newlyEscalated) window._sirenMuted = false;
    updateSirenState();
    if($overlay.innerHTML.trim()==="") render();
  }
}
function renderAlarmOverlay(){
  window._alarmShowing = true;
  $overlay.innerHTML = `<div class="overlay" style="background:rgba(192,57,43,.55);">
    <div class="sheet" style="border-top:6px solid var(--red);">
      <div class="sheet-head"><h2>⏰ Timer scaduto</h2></div>
      ${ringingTimers.map(t=>`
        <div class="noco-card" style="margin-bottom:10px;">
          <b>${t.label}</b>
          <div class="rowbtns" style="margin-top:8px;">
            <button class="btn danger block" onclick="dismissAlarm('${t.targetKey}')">🔕 Ho controllato — Ferma allarme</button>
          </div>
        </div>
      `).join("")}
    </div>
  </div>`;
}
async function dismissAlarm(targetKey){
  timers = timers.filter(t=>t.targetKey!==targetKey);
  ringingTimers = ringingTimers.filter(t=>t.targetKey!==targetKey);
  saveTimers();
  if(ringingTimers.length===0){
    stopAlarmSound();
    window._alarmShowing = false;
    $overlay.innerHTML = "";
    render();
  } else {
    renderAlarmOverlay();
  }
}
function beep(){
  try{
    const ctx = window._audioCtx || (window._audioCtx = new (window.AudioContext||window.webkitAudioContext)());
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime+0.25);
  }catch(e){}
}
function startAlarmSound(){
  if(alarmAudioTimer) return;
  beep();
  alarmAudioTimer = setInterval(beep, 900);
}
function stopAlarmSound(){
  if(alarmAudioTimer){ clearInterval(alarmAudioTimer); alarmAudioTimer=null; }
}

// ---------- TEMPERATURE ----------
function pointStatusToday(p, date){
  const t = date || todayISO();
  const filtrate = logs.temperature.filter(r=>r.pointId===p.id && r.data===t);
  const rec = filtrate.length? filtrate[filtrate.length-1] : null; // l'ultimo inserito, non il "più tardi" per orario testuale (due letture nello stesso minuto altrimenti darebbero un risultato ambiguo)
  if(!rec) return {state:"missing", rec:null};
  if(rec.spento) return {state:"spento", rec};
  return {state: rec.conforme ? "ok":"bad", rec};
}

let meseFuoriSogliaTemp = todayISO().slice(0,7);
let meseExportTemp = todayISO().slice(0,7);
let meseExportSanif = todayISO().slice(0,7);
let meseExportProduzione = todayISO().slice(0,7);

let meseExportCoai = todayISO().slice(0,7);

let fornitoreFiltroProduzione = "";
let statoFiltroProduzione = "";
let tipoFiltroProduzione = "";
// Per ogni frigo: trova la data mancante più recente da agosto 2026 in poi (esclusi oggi e i giorni "spento"),
// per segnalarla subito in elenco senza dover controllare data per data.
const DATA_INIZIO_CONTROLLO_TEMP = "2026-08-01";
function dataPregressaMancanteTemp(pointId){
  const oggi = todayISO();
  let d = addDaysISO(oggi, -1);
  while(d >= DATA_INIZIO_CONTROLLO_TEMP){
    const esiste = logs.temperature.some(r=>r.pointId===pointId && r.data===d);
    if(!esiste) return d;
    d = addDaysISO(d, -1);
  }
  return null;
}
function meseFilterTempHtml(){
  const mesi = [...new Set(logs.temperature.map(r=>r.data.slice(0,7)))].sort().reverse();
  if(!mesi.length) return "";
  return `<select onchange="setMeseFiltroTemp(this.value)" style="margin-bottom:10px;">
    <option value="" ${!meseFiltroTemp?'selected':''}>Mese</option>
    ${mesi.map(m=>`<option value="${m}" ${meseFiltroTemp===m?'selected':''}>${MONTHS[parseInt(m.slice(5,7),10)-1]} ${m.slice(0,4)}</option>`).join("")}
  </select>`;
}

function renderTemperatureMese(pointsFiltered){
  const idsVisibili = new Set(pointsFiltered.map(p=>p.id));

      ${repartoFilterHtml(repartoFiltroTemp, "setRepartoFiltroTemp")}

function renderTemperature(){
  const pointsFiltered = (repartoFiltroTemp ? config.points.filter(p=>p.reparto===repartoFiltroTemp) : config.points).filter(p=>hasRepartoAccess(p.reparto));

  if(statoFiltroTemp==="fuorisoglia"){
    renderTemperatureFuoriSoglia(pointsFiltered);
    return;
  }
  if(meseFiltroTemp){
    renderTemperatureMese(pointsFiltered);
    return;
  }

  const dataRif = dateFiltroTemp || todayISO();
  const isOggi = !dateFiltroTemp;
  let pointsConStato = pointsFiltered.map(p=>({p, st: pointStatusToday(p, dataRif)}));
  if(statoFiltroTemp==="confermato") pointsConStato = pointsConStato.filter(x=>x.st.state!=="missing");
  else if(statoFiltroTemp==="daregistrare") pointsConStato = pointsConStato.filter(x=>x.st.state==="missing");
  let tiles = pointsConStato.map(({p, st})=>{
    const rangeLbl = p.type==="freezer" ? `≤ ${p.max}°C` : `${p.min}° / ${p.max}°C`;
    const noLetturaLbl = isOggi? "Nessuna lettura oggi" : `Nessuna lettura il ${fmtDate(dataRif)}`;
    const valLbl = !st.rec ? noLetturaLbl : st.state==="spento" ? `🔌 OFF alle ${st.rec.ora}${st.rec.tardiva?' ⏱️':''}` : `${st.rec.valore}°C alle ${st.rec.ora}${st.rec.tardiva?' ⏱️':''}`;
    const chipCls = st.state==="ok"?"ok":st.state==="bad"?"bad":st.state==="spento"?"spento":"missing";
    const chipTxt = st.state==="ok"?"Conforme":st.state==="bad"?"Fuori soglia":st.state==="spento"?"Spento":"Da registrare";
    const auditSt = isOggi? pointAuditStatus(p.id) : null;
    const auditCls = auditSt==='escalated' ? 'audit-escalated' : auditSt==='notice' ? 'audit-notice' : '';
    const pregressaMancante = isOggi ? dataPregressaMancanteTemp(p.id) : null;
    return `<div class="checklist-item ${auditCls}" style="flex-wrap:wrap;cursor:pointer;" onclick="openPointDetail('${p.id}')">
      <div class="lbl">
        ${pointIcon(p.type)} ${p.name} ${p.reparto? `<span class="muted" style="font-size:11px;">📍 ${p.reparto}</span>`:""}
        <div class="muted" style="font-size:12px;font-weight:400;">Soglia: ${rangeLbl} · ${valLbl}</div>
        ${pregressaMancante? `<span class="timer-badge expired" style="cursor:pointer;" onclick="event.stopPropagation();${isAdmin()? `openTempEntry('${p.id}','manuale','${pregressaMancante}')` : `setDateFiltroTemp('${pregressaMancante}')`}">🔴 TEMPERATURA MANCANTE PER IL GIORNO ${fmtDate(pregressaMancante)}</span>`:''}
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        ${isAdmin()? `<button class="iconbtn" style="font-size:15px;padding:6px 9px;" onclick="event.stopPropagation();openEditPoint('${p.id}')" title="Modifica o elimina">✏️</button>`:""}
        <div class="chip ${chipCls}">${chipTxt}</div>
        ${isOggi && timerFor('temp:'+p.id) ? `<span class="timer-badge" data-timer-key="temp:${p.id}">⏱️ ${fmtCountdown(timerFor('temp:'+p.id).endTime-Date.now())}</span>` : ""}
        ${auditSt==='escalated' ? `<span class="timer-badge expired">🚨 CONTROLLO MANCANTE</span>` : auditSt==='notice' ? `<span class="timer-badge">⚠️ da verificare</span>` : ""}
      </div>
    </div>`;
  }).join("");
  if(!pointsConStato.length) tiles = `<div class="empty">${repartoFiltroTemp||statoFiltroTemp? `Nessun punto di controllo corrisponde ai filtri scelti.` : "Nessun punto di controllo configurato."}</div>`;

  $main.innerHTML = `
    <div class="card">
      <div class="card-head"><h2>Punti di controllo ${!isOggi? `— ${fmtDate(dataRif)}`:''}</h2><div style="display:flex;gap:6px;">${printBtn('temperature', meseExportTemp)}${saveBtn('temperature', meseExportTemp)}</div></div>
      ${repartoFilterHtml(repartoFiltroTemp, "setRepartoFiltroTemp")}
      ${dateFilterHtml(dateFiltroTemp, "setDateFiltroTemp")}
      ${meseFilterTempHtml()}
      <select onchange="setStatoFiltroTemp(this.value)" style="margin-bottom:10px;">
        <option value="" ${!statoFiltroTemp?'selected':''}>Tutti gli stati</option>
        <option value="confermato" ${statoFiltroTemp==='confermato'?'selected':''}>✅ Confermato (già registrato)</option>
        <option value="daregistrare" ${statoFiltroTemp==='daregistrare'?'selected':''}>⏳ Da registrare</option>
        <option value="fuorisoglia">🔴 Fuori soglia</option>
      </select>
      ${tiles}
      ${isAdmin()? `<div class="rowbtns"><button class="btn secondary block" onclick="openAddPoint()">+ Aggiungi frigo / freezer / banco</button></div>`:""}
    </div>
  `;
}

function buildMonthGrid(kind, filterId, point, meseYYYYMM){
  const [yStr, mStr] = (meseYYYYMM || todayISO().slice(0,7)).split("-");
  const year = parseInt(yStr,10), month = parseInt(mStr,10)-1;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const t = todayISO();
  let rows = "";
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cellHtml, cls;
    if(kind==="temperature"){
      const recs = logs.temperature.filter(r=>r.pointId===filterId && r.data===iso);
      if(recs.length){
        const last = recs[recs.length-1];
        if(last.spento){
          cls = "spento";
          cellHtml = `<span onclick="openTempEntryDetail('${last.id}')" style="cursor:pointer;text-decoration:underline;">🔌 OFF</span>`;
        } else {
          cls = last.conforme?"ok":"bad";
          cellHtml = `<span onclick="openTempEntryDetail('${last.id}')" style="cursor:pointer;text-decoration:underline;">${last.valore}°${last.photoKey?' 📷':''}</span>`;
        }
      } else { cls=""; cellHtml="—"; }
    } else {
      const rec = logs.sanificazione.find(r=>r.item===filterId.item && r.frequenza===filterId.freq && r.data===iso);
      cls = rec?"ok":"";
      if(rec){
        cellHtml = `<span onclick="openSanifDetail('${rec.id}')" style="cursor:pointer;text-decoration:underline;">✓ 📷</span>`;
      } else if(isAdmin() && iso<=t){
        cellHtml = `<span onclick="openSanifConfirmRetroattivo('${filterId.item.replace(/'/g,"\\'")}','${iso}')" style="cursor:pointer;text-decoration:underline;color:var(--red);">— ✏️</span>`;
      } else {
        cellHtml = "—";
      }
    }
    if(iso===t) cls += " today";
    rows += `<tr><td>${d}</td><td class="${cls}">${cellHtml}</td></tr>`;
  }
  return `<div style="max-height:260px;overflow-y:auto;"><table class="month">
    <tr><th>Giorno</th><th>Valore</th></tr>${rows}
  </table></div>`;
}

    document.getElementById("photoPreviewArea").innerHTML = `<img src="${reader.result}"><div style="margin-top:10px;"><span class="spinner"></span> Lettura in corso...</div>`;

          <label class="field">Operatore</label><input type="text" id="tempOp" value="${lastOperator}">
          <div class="rowbtns"><button class="btn block" onclick="saveTempManual('${pointId}')">Salva</button></div>`;
      }
      return;
    }
    try{
      const result = await readTemperatureFromPhoto(base64, file.type);
      renderPhotoResult(result, pointId, p, reader.result);
    }catch(err){
      document.getElementById("photoResultArea").innerHTML = `<p class="muted">⚠️ Non sono riuscito a leggere la foto automaticamente. Inserisci il valore manualmente qui sotto.</p>
        <label class="field">Valore (°C)</label><input type="number" step="0.1" id="tempVal">

        <div class="rowbtns"><button class="btn block" onclick="saveTempManual('${pointId}')">Salva</button></div>`;
    }
  };
  reader.readAsDataURL(file);
}

async function readTemperatureFromPhoto(base64, mediaType){
  const data = await aiRequest({
      model: ANTHROPIC_MODEL,
      max_tokens: 300,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType||"image/jpeg", data: base64 } },
          { type: "text", text: "Questa è una foto del display di un termometro o del pannello di un frigorifero/freezer/banco caldo di un ristorante. Leggi il valore numerico della temperatura mostrato sul display. Rispondi SOLO con un oggetto JSON, senza testo aggiuntivo, nel formato: {\"temperatura\": <numero o null se non leggibile>, \"confidenza\": \"alta\"|\"media\"|\"bassa\", \"nota\": \"<breve nota se utile>\"}" }
        ]
      }]
  });
  const textBlock = (data.content||[]).find(b=>b.type==="text");
  if(!textBlock) throw new Error("no text");
  const clean = textBlock.text.replace(/```json|```/g,"").trim();
  return JSON.parse(clean);
}

function timeToMinutes(t){ const [h,m] = (t||"0:0").split(":").map(Number); return h*60+m; }
async function commitTempReading(pointId, val, op, fonte, customDateTime){
  const p = config.points.find(x=>x.id===pointId);
  const conforme = p.type==="freezer" ? (val<=p.max) : (val>=p.min && val<=p.max);
  const data = (customDateTime && customDateTime.data) || todayISO();
  const ora = (customDateTime && customDateTime.ora) || nowTime();
  const tardiva = data!==todayISO() || Math.abs(timeToMinutes(ora)-timeToMinutes(nowTime()))>10;
  const rec = { id:uid(), pointId, pointName:p.name, data, ora, valore:val, operatore:op, conforme, fonte, tardiva, registratoIl:new Date().toISOString() };
  if(fonte==="foto" && window._tempPhoto){
    rec.photoKey = "photo-temp-"+rec.id;
    DB.set(rec.photoKey, window._tempPhoto, true).catch(()=>toast("⚠️ Errore di salvataggio foto"));
    window._tempPhoto = null;
  }
  logs.temperature.push(rec);
  saveLog("temperature").catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
  saveOperator(op).catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
  toast((conforme? "Temperatura registrata ✅" : "Registrata — FUORI SOGLIA ⚠️") + (tardiva? " · ⏱️ inserita in ritardo":""));
  if(!conforme){
    openAzioniCorrettive(p, val, op, fonte, rec);
  }
  return conforme; // false = è stata aperta la scheda azioni correttive: chi chiama NON deve richiuderla
}

// ---------- AZIONI CORRETTIVE GUIDATE ----------
function scostamentoInfo(p, val){
  if(p.type==="hot"){
    return {verso:"basso", delta:+(p.min - val).toFixed(1),
      rischio: val < (p.min - 5) ? "alto" : "medio",
      testo:`temperatura di mantenimento a caldo insufficiente (${val}°C contro il minimo di ${p.min}°C)`};
  }
  if(val > p.max){
    const d = +(val - p.max).toFixed(1);
    return {verso:"alto", delta:d, rischio: d > 4 ? "alto" : "medio",
      testo:`temperatura troppo elevata (${val}°C contro il massimo di ${p.max}°C)`};
  }
  return {verso:"basso", delta:+(p.min - val).toFixed(1), rischio:"medio",
    testo:`temperatura troppo bassa (${val}°C contro il minimo di ${p.min}°C)`};
}
function azioniProposte(p, info){
  if(p.type==="hot"){
    return ["Aumentata la temperatura del banco caldo e riverificata dopo 30 minuti",
      "Prodotto rigenerato in forno fino al raggiungimento di almeno 75°C al cuore",
      "Prodotto eliminato perché mantenuto sotto i 60°C per oltre 2 ore",
      "Verificato il funzionamento delle resistenze / richiesta assistenza tecnica"];
  }
  if(info.verso==="alto"){
    const base = ["Verificata la corretta chiusura della porta e lo stato delle guarnizioni",
      "Abbassato il termostato e riverificata la temperatura dopo 30 minuti",
      "Eseguito sbrinamento e pulizia del condensatore",
      "Ridotto il carico di merce per consentire la corretta circolazione dell'aria",
      "Alimenti trasferiti in altro punto di conservazione a temperatura conforme",
      "Richiesto intervento del tecnico frigorista"];
    if(info.rischio==="alto"){
      base.splice(1, 0, "Alimenti deperibili eliminati perché esposti a temperatura non conforme");
    }
    return base;
  }
  return ["Alzato il termostato e riverificata la temperatura dopo 30 minuti",
    "Verificato che gli alimenti non abbiano subito congelamento accidentale",
    "Alimenti congelati accidentalmente eliminati",
    "Richiesto intervento del tecnico frigorista"];
}
function openAzioniCorrettive(p, val, op, fonte, rec){
  const info = scostamentoInfo(p, val);
  const azioni = azioniProposte(p, info);
  window._acSel = new Set();
  const sogliaLbl = p.type==="freezer" ? `≤ ${p.max}°C` : p.type==="hot" ? `≥ ${p.min}°C` : `${p.min}°C / ${p.max}°C`;
  openSheet("⚠️ Azione correttiva richiesta", `
    <div class="card" style="padding:12px;border:2px solid var(--red);margin-bottom:12px;">
      <div style="font-weight:800;font-size:15px;">${p.name} — ${val}°C</div>
      <div class="muted" style="font-size:12px;margin-top:4px;">
        Soglia di conformità: ${sogliaLbl} · scostamento di ${info.delta}°C ·
        rischio ${info.rischio==='alto'? '<b style="color:var(--red);">ALTO</b>' : 'medio'}
      </div>
      ${info.rischio==='alto'? `<div class="muted" style="font-size:12px;margin-top:6px;">Scostamento rilevante: valuta l'eliminazione degli alimenti deperibili se l'esposizione si è protratta.</div>`:''}
    </div>
    <p class="muted">Seleziona le azioni correttive adottate. Verrà generato automaticamente il verbale di non conformità.</p>
    <div id="acLista">
      ${azioni.map((a,i)=>`
        <label class="ac-opt" onclick="toggleAzione(${i},'${a.replace(/'/g,"\\'")}',this)">
          <span class="ac-box">☐</span><span>${a}</span>
        </label>`).join("")}
    </div>
    <label class="field">Altra azione / note</label>
    <textarea id="acAltro" placeholder="Descrivi eventuali altre azioni adottate"></textarea>
    <label class="field">Operatore che interviene</label>
    <input type="text" id="acOp" value="${op}">
    <label class="ac-opt" onclick="toggleRiverifica(this)" id="acRiverificaRow">
      <span class="ac-box" id="acRivBox">☑</span><span>Programma la riverifica della temperatura tra 30 minuti</span>
    </label>
    <div class="rowbtns">
      <button class="btn danger block" onclick="salvaAzioneCorrettiva('${p.id}', ${val}, '${rec.id}')">Registra azione e apri verbale</button>
    </div>
  `);
  window._acRiverifica = true;
}
function toggleAzione(i, testo, el){
  if(window._acSel.has(testo)){ window._acSel.delete(testo); el.classList.remove("sel"); el.querySelector(".ac-box").textContent="☐"; }
  else { window._acSel.add(testo); el.classList.add("sel"); el.querySelector(".ac-box").textContent="☑"; }
}
function toggleRiverifica(el){
  window._acRiverifica = !window._acRiverifica;
  el.querySelector(".ac-box").textContent = window._acRiverifica ? "☑" : "☐";
  el.classList.toggle("sel", window._acRiverifica);

function dataPregressaMancante(item, freq){
  if(freq !== "giornaliera") return null;

    const esiste = logs.sanificazione.some(r=>r.item===item && r.frequenza===freq && r.data===d);

  return null;
}

function compressImage(dataUrl, maxWidth){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.55));
    };
    img.src = dataUrl;
  });
}

function handleBollaPhoto(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    document.getElementById("momaBollaResult").innerHTML = `<img src="${reader.result}"><div style="margin-top:10px;"><span class="spinner"></span> Lettura bolla in corso...</div>`;
    window._bollaPhoto = await compressImage(reader.result, 700);
    const base64 = reader.result.split(",")[1];
    if(!canUseClaudeAI()){
      try{
        const text = await runOcr(reader.result, (pct)=>{
          document.getElementById("momaBollaResult").innerHTML = `<img src="${reader.result}"><div style="margin-top:10px;"><span class="spinner"></span> Lettura testo gratuita in corso... ${pct}%</div>`;
        });
        const ddtMatch = text.match(/(?:fattura|documento|ddt|bolla)\s*n[ro.]*\s*[:.]?\s*(\d+)/i);
        if(ddtMatch) document.getElementById("momaDdt").value = ddtMatch[1];
        const noteEl = document.getElementById("momaNote");

        document.getElementById("momaBollaResult").innerHTML = `<img src="${reader.result}"><p class="muted" style="margin-top:8px;font-size:12px;">📖 Lettura gratuita (Tesseract OCR) — ho incollato il testo letto nelle Note qui sotto: copia da lì fornitore, numero e prodotti nei campi giusti. Non è preciso come la lettura AI, controlla con attenzione.</p>`;
        window._bollaProdotti = [];
        renderBollaProdottiEditor();
      }catch(err){
        document.getElementById("momaBollaResult").innerHTML = `<img src="${reader.result}"><p class="muted" style="margin-top:8px;">⚠️ Lettura gratuita non riuscita: ${esc(err.message||'')}. La foto viene comunque allegata, compila i campi manualmente.</p>`;
      }
      return;
    }
    try{
      const result = await readBollaFromPhoto(base64, file.type);
      if(result.fornitore) document.getElementById("momaFornitore").value = result.fornitore;
      if(result.numero_ddt) document.getElementById("momaDdt").value = result.numero_ddt;
      window._bollaDataDoc = result.data_documento || null;

  };
  reader.readAsDataURL(file);
}

async function readRecipeFromPhoto(base64, mediaType){
  const data = await aiRequest({
      model: ANTHROPIC_MODEL,
      max_tokens: 1500,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType||"image/jpeg", data: base64 } },
          { type: "text", text: "Questa è la foto di una ricetta scritta o stampata (ricettario, appunti dello chef, scheda tecnica) di un piatto o preparazione di un ristorante. Trascrivi integralmente il contenuto. Rispondi SOLO con un oggetto JSON, senza testo aggiuntivo, nel formato: {\"nome\": \"<nome del piatto/preparazione>\", \"ingredienti\": [\"<nome ingrediente 1>\", \"<nome ingrediente 2>\"], \"procedimento\": \"<trascrizione integrale e completa del procedimento/istruzioni così come scritto, comprese le quantità, mantenendo l'ordine originale>\", \"giorni_conservazione\": <numero di giorni di conservazione del preparato se indicato nella ricetta, altrimenti null>, \"nota\": \"<eventuale nota se alcune parti non sono leggibili>\"}. Per 'ingredienti' usa nomi puliti e generici (es. 'Farina 00', 'Pomodoro San Marzano') senza quantità, adatti a essere confrontati con i nomi dei prodotti nelle bolle di consegna. Nel campo 'procedimento' riporta invece il testo integrale così come scritto, comprese le quantità e i passaggi." }
        ]
      }]
  });
  const textBlock = (data.content||[]).find(b=>b.type==="text");
  if(!textBlock) throw new Error("no text");
  const clean = textBlock.text.replace(/```json|```/g,"").trim();
  return JSON.parse(clean);
}

// Riconosce dal nome se un articolo è a lunga conservazione (non deperibile a breve termine),
// per non assegnargli una scadenza di 7 giorni come ai prodotti freschi.
const PAROLE_LUNGA_CONSERVAZIONE = [
  // alcolici e superalcolici
  "vodka","gin","rum","whisky","whiskey","grappa","liquore","liquor","amaro","brandy","cognac","tequila",
  "vino","spumante","prosecco","champagne","birra","vermouth","aperitivo","bitter","sciroppo",
  // materiale monouso / plastica / carta
  "bicchiere","bicchier","piatto plastica","piatti plastica","posate plastica","tovagliolo","tovagliol",
  "sacchetto","sacchett","contenitore plastica","cannuccia","cannucc","stuzzicadent","tovaglia carta",
  "carta forno","pellicola","alluminio","stagnola","guanti",
  // detergenza e pulizia
  "detersivo","detergente","sgrassatore","candeggina","disinfettante","sapone","alcool denaturato",
  "igienizzante","brillantante","ammorbidente",
  // dispensa a lunga conservazione
  "scatola","scatolame","conserva","pelati","passata","concentrato di pomodoro","farina","zucchero",
  "sale","riso","pasta secca","legumi secchi","fagioli secchi","ceci secchi","olio","aceto","caffè","caffe",
  "tè ","biscotti","cioccolato","cacao","lievito","topping","dado","spezie","spezia","zafferano",
  "miele","marmellata","confettura","gallette","cereali","farro","couscous","quinoa","zucch"
];
// Prodotti freschi che condividono l'inizio del nome con una parola chiave "lunga conservazione"
// (es. "zucchine" inizia come "zucchero") — vanno esclusi esplicitamente per non generare falsi positivi.
const PAROLE_ESCLUSE_FRESCHI = ["zucchin"]; // zucchine/zucchina: deperibili, non vanno confuse con lo zucchero
function isLungaConservazione(nome){
  const n = (nome||"").toLowerCase();
  if(PAROLE_ESCLUSE_FRESCHI.some(k => n.includes(k))) return false;
  return PAROLE_LUNGA_CONSERVAZIONE.some(k => n.includes(k));
}
async function applicaLungaConservazioneRetroattiva(){
  if(!isAdmin()){ toast("⛔ Solo l'amministratore può farlo"); return; }
  const daAggiornare = logs.produzione.filter(p => !p.esaurito && !p.lungaConservazione && isLungaConservazione(p.prodotto));
  if(!daAggiornare.length){ toast("Nessun articolo da aggiornare: tutti quelli riconoscibili sono già impostati correttamente."); return; }
  if(!confirm(`Trovati ${daAggiornare.length} articoli a lunga conservazione tra quelli già presenti (es. alcolici, dispensa, monouso). Aggiornare la loro scadenza a 2 anni dalla consegna?`)) return;
  daAggiornare.forEach(p=>{
    p.dataScadenza = addDaysISO(p.dataConsegna || todayISO(), 730);
    p.lungaConservazione = true;
    p.note = (p.note||"") + " [Scadenza corretta automaticamente: riconosciuto come articolo a lunga conservazione.]";
  });
  await saveLog("produzione");
  toast(`✅ Aggiornati ${daAggiornare.length} articoli`);
  render();
}
async function saveMoma(){
  const fornitore = document.getElementById("momaFornitore").value.trim();
  const ddt = document.getElementById("momaDdt").value.trim();
  const note = document.getElementById("momaNote").value.trim();
  const op = document.getElementById("momaOp").value.trim();
  const checks = window._momaChecks||{};
  if(!fornitore){ toast("Inserisci il fornitore"); return; }
  if(!op){ toast("Inserisci l'operatore"); return; }
  if(Object.keys(checks).length < MOMA_CHECKS.length){ toast("Completa tutte le verifiche"); return; }
  const rec = {id:uid(), data:todayISO(), ora:nowTime(), fornitore, ddt, checks, note, operatore:op};
  if(window._bollaPhoto){
    rec.photoKey = "photo-moma-"+rec.id;
    DB.set(rec.photoKey, window._bollaPhoto, true).catch(()=>toast("⚠️ Errore di salvataggio foto bolla"));
    window._bollaPhoto = null;
  }
  logs.moma.push(rec);
  saveLog("moma").catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
  saveOperator(op).catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));

  const prodotti = (window._bollaProdotti||[]).filter(p=>p.nome && p.nome.trim());
  if(prodotti.length){
    const consegna = todayISO();
    const scadenza = addDaysISO(consegna, 7);
    // Data di emissione della bolla (gg/mm/aaaa dalla lettura, altrimenti data consegna)
    let dataBolla = consegna, dataBollaLbl = fmtDate(consegna);
    if(window._bollaDataDoc){
      const m = String(window._bollaDataDoc).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
      if(m){
        const yy = m[3].length===2 ? "20"+m[3] : m[3];
        dataBolla = `${yy}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
        dataBollaLbl = `${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${yy}`;
      }
    }
    const sett = isoWeekOfYear(dataBolla);
    prodotti.forEach(p=>{
      const lottoFinale = (p.lotto && p.lotto.trim())
        ? p.lotto.trim()
        : `DDT ${ddt||'s.n.'} del ${dataBollaLbl} · sett. ${sett}`;
      const lunga = isLungaConservazione(p.nome);
      const scadenzaProdotto = lunga ? addDaysISO(consegna, 730) : scadenza;
      logs.produzione.push({
        id: uid(),
        prodotto: p.nome.trim(),
        lotto: lottoFinale,
        lottoStimato: !(p.lotto && p.lotto.trim()),
        quantita: p.quantita ? p.quantita.trim() : "",
        fornitore, ddt,
        dataConsegna: consegna,
        dataInizioProduzione: consegna,
        dataScadenza: scadenzaProdotto,
        lungaConservazione: lunga,
        note: `Tracciabilità: consegna del ${fmtDate(consegna)} da ${fornitore}, DDT ${ddt||'—'}, lotto ${lottoFinale}${(p.lotto && p.lotto.trim())? '' : " (lotto non presente in bolla — tracciato con data emissione bolla e settimana dell'anno)"}.${lunga? ' Prodotto a lunga conservazione: scadenza indicativa, verificare e correggere se necessario.':''}`,
        momaId: rec.id,
        esaurito: false
      });
    });
    saveLog("produzione").catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
  }

  toast(allMomaConforme(rec)? "Consegna registrata ✅" : "Registrata — presenti non conformità ⚠️");
  if(prodotti.length) toast(`${prodotti.length} scheda/e di produzione create con scadenza 7gg`);
  if(!allMomaConforme(rec)){
    const badItems = MOMA_CHECKS.filter(c=>checks[c.key]==="non_conforme").map(c=>c.label).join(", ");
    prefillNoco(`Consegna ${fornitore}`, `Riscontrata non conformità in fase di ricevimento merce (${badItems}). DDT: ${ddt||'—'}. ${note||''}`, op);
    // NON chiudere qui: prefillNoco ha già aperto il modulo di non conformità da compilare e confermare.
  } else {
    closeSheet();
  }
}
function addDaysISO(iso, days){
  const d = new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+days);
  return toLocalISODate(d);

// Normalizza un nome fornitore per confrontarlo con altre varianti: minuscolo, senza punteggiatura,
// senza forme societarie comuni (srl, spa, ecc.) e senza spazi doppi — per unificare varianti come
// "Casearia Agricol Sud S.r.l." e "Casearia AgricolSud srl".
function normalizzaFornitore(nome){
  let n = (nome||"").toLowerCase();
  n = n.replace(/[.,\/\-]/g, " ");
  n = n.replace(/\b(s\s*r\s*l|s\s*p\s*a|s\s*a\s*s|s\s*n\s*c|s\s*s|di|e\s*c\b|srls)\b/g, " ");
  n = n.replace(/\s+/g, "");
  return n;
}
function trovaGruppiFornitoriSimili(){
  const tutti = new Set();
  logs.produzione.forEach(p=>{ if(p.fornitore) tutti.add(p.fornitore); });
  logs.moma.forEach(m=>{ if(m.fornitore) tutti.add(m.fornitore); });
  const gruppi = {};
  [...tutti].forEach(nome=>{
    const key = normalizzaFornitore(nome);
    if(!key) return;
    if(!gruppi[key]) gruppi[key] = [];
    gruppi[key].push(nome);
  });
  return Object.values(gruppi).filter(varianti=>varianti.length>1);
}
function openUnificaFornitori(){
  if(!isAdmin()){ toast("⛔ Solo l'amministratore può farlo"); return; }
  const gruppi = trovaGruppiFornitoriSimili();
  if(!gruppi.length){ toast("Nessuna variante di fornitore trovata: sono già tutti distinti."); return; }
  openSheet("🔗 Unifica fornitori simili", `
    <p class="muted">Trovat${gruppi.length===1?'o':'i'} ${gruppi.length} gruppo/i di nomi che sembrano lo stesso fornitore scritto in modo diverso. Controlla e correggi il nome definitivo per ciascuno — lascia vuoto un gruppo per NON unificarlo.</p>
    ${gruppi.map((varianti,gi)=>{
      // Suggerisco come nome definitivo quello scritto in modo più completo (più lungo)
      const suggerito = varianti.slice().sort((a,b)=>b.length-a.length)[0];
      return `
      <div class="card" style="padding:11px;background:var(--cream);border:1px solid var(--line);margin-bottom:10px;">
        <div class="muted" style="font-size:12px;margin-bottom:6px;">Varianti trovate:</div>
        ${varianti.map(v=>`<div style="font-size:13px;">• ${esc(v)}</div>`).join("")}
        <label class="field" style="margin-top:8px;">Nome definitivo da usare</label>
        <input type="text" id="unifNome-${gi}" value="${esc(suggerito)}" data-varianti='${esc(JSON.stringify(varianti))}'>
      </div>`;
    }).join("")}
    <div class="rowbtns"><button class="btn block" onclick="applicaUnificaFornitori(${gruppi.length})">Applica le unificazioni</button></div>
  `);
}
async function applicaUnificaFornitori(numGruppi){
  let totaleModifiche = 0;
  let gruppiApplicati = 0;
  for(let gi=0; gi<numGruppi; gi++){
    const input = document.getElementById(`unifNome-${gi}`);
    if(!input) continue;
    const nomeDefinitivo = input.value.trim();
    if(!nomeDefinitivo) continue; // lasciato vuoto: salta questo gruppo
    const varianti = JSON.parse(input.dataset.varianti);
    const daSostituire = varianti.filter(v=>v!==nomeDefinitivo);
    if(!daSostituire.length) continue;
    gruppiApplicati++;
    logs.produzione.forEach(p=>{
      if(daSostituire.includes(p.fornitore)){ p.fornitore = nomeDefinitivo; totaleModifiche++; }
    });
    logs.moma.forEach(m=>{
      if(daSostituire.includes(m.fornitore)){ m.fornitore = nomeDefinitivo; totaleModifiche++; }
    });
  }
  if(!gruppiApplicati){ toast("Nessuna unificazione da applicare (tutti i campi erano vuoti o invariati)."); return; }
  await saveLog("produzione");
  await saveLog("moma");
  toast(`✅ Unificati ${gruppiApplicati} gruppo/i di fornitori (${totaleModifiche} registrazioni aggiornate)`);
  activeTab="produzione"; closeSheet();
}

function produzioneListHtml(query){
  const q = (query||"").trim();
  const includiEsauriti = statoFiltroProduzione === "esaurito";
  let sorted = [...logs.produzione].filter(p=>(includiEsauriti? p.esaurito : !p.esaurito) && !p.semilavorato).sort((a,b)=>a.dataScadenza.localeCompare(b.dataScadenza));
  if(q) sorted = sorted.filter(p=>textMatchesQuery(p.prodotto,q) || textMatchesQuery(p.lotto||"",q) || textMatchesQuery(p.fornitore||"",q));
  if(dateFiltroProduzione) sorted = sorted.filter(p=>p.dataConsegna===dateFiltroProduzione);
  if(fornitoreFiltroProduzione) sorted = sorted.filter(p=>p.fornitore===fornitoreFiltroProduzione);
  const t = todayISO();
  function statusOf(p){
    if(p.esaurito) return "spento";
    if(p.dataScadenza < t) return "bad";
    const diffDays = Math.round((new Date(p.dataScadenza)-new Date(t))/86400000);
    if(diffDays <= 1) return "missing";
    return "ok";
  }
  if(statoFiltroProduzione && !includiEsauriti) sorted = sorted.filter(p=>statusOf(p)===statoFiltroProduzione);
  function statusLabel(p){
    if(p.esaurito) return "Esaurito";
    const s = statusOf(p);
    return s==="bad"? "SCADUTO" : s==="missing"? "In scadenza" : "Valido";
  }
  if(!sorted.length) return `<div class="empty">
    ${q||dateFiltroProduzione||fornitoreFiltroProduzione||statoFiltroProduzione? `Nessun prodotto trovato.` : "Nessun prodotto in produzione al momento."}
    ${q? `<div class="rowbtns"><button class="btn secondary block" onclick="openProduzioneForm('${q.replace(/'/g,"\\'")}')">+ Aggiungi "${esc(q)}" come nuovo prodotto</button></div>` : ''}
  </div>`;
  return sorted.map(p=>`
    <div class="logrow" onclick="openProduzioneDetail('${p.id}')" style="cursor:pointer;">
      <div>
        <div class="val">${p.lungaConservazione? '🗄️ ':''}${p.prodotto}</div>
        <div class="meta">Lotto: ${p.lotto||'—'} · ${p.fornitore} · consegna ${fmtDate(p.dataConsegna)} · ${p.esaurito? `esaurito il ${fmtDate(p.dataEsaurimento)}` : `scade il ${fmtDate(p.dataScadenza)}`}</div>
        ${window._produzioneSelectContext? `<button class="btn secondary" style="margin-top:6px;padding:6px 10px;font-size:12px;" onclick="event.stopPropagation();usaArticoloPerComposizione('${p.id}')">✅ Usa questo lotto per la ricetta</button>` : ''}
      </div>
      <span class="chip ${statusOf(p)}">${statusLabel(p)}</span>
    </div>`).join("");
}

function produzioneEsauritiHtml(query){

// ---------- RICETTE / COMPOSIZIONE PRODOTTI ----------
const MATCH_STOPWORDS = new Set(["kg","g","gr","grammi","l","lt","litri","ml","pz","pezzi","conf","confezione","confezioni","da","di","del","della","dei","delle","tipo","circa","cad","cadauno","x","per","con","senza","e","ed","a","al","alla","allo","ai","agli","in","nel","nella"]);
function normalizeTokens(s){
  return (s||"")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"") // rimuove accenti
    .replace(/['".,;:()]/g," ")
    .split(/\s+/)
    .filter(Boolean);
}
function meaningfulTokens(s){
  return normalizeTokens(s).filter(t=>!MATCH_STOPWORDS.has(t) && !/^\d+([.,]\d+)?$/.test(t));
}
function tokenMatchScore(ingTokens, prodTokens){
  if(!ingTokens.length || !prodTokens.length) return 0;
  let matched = 0;
  ingTokens.forEach(tok=>{
    if(prodTokens.includes(tok) || prodTokens.some(p=> (p.length>=4 && tok.length>=4) && (p.startsWith(tok)||tok.startsWith(p)) )) matched++;
  });
  if(matched===0) return 0;
  // Se il prodotto INIZIA con le stesse parole dell'ingrediente (es. "Latte" → "Latte intero"),
  // è un'ottima corrispondenza anche se il prodotto ha altre parole dopo.
  const iniziaUguale = ingTokens.every((tok,idx)=>{
    const p = prodTokens[idx];
    return p && (p===tok || (p.length>=4 && tok.length>=4 && (p.startsWith(tok)||tok.startsWith(p))));
  });
  if(iniziaUguale) return 1;
  // Altrimenti punteggio simmetrico: penalizza le parole extra del prodotto, che di solito
  // indicano un prodotto diverso — es. "Fior di latte" per l'ingrediente "Latte".
  const unione = ingTokens.length + Math.max(0, prodTokens.length - matched);
  return unione? matched/unione : 0;
}
function findLottoForIngredient(nomeIngrediente){
  const c = findLottiForIngredient(nomeIngrediente);
  return c.length ? c[0] : null;
}
function findLottiForIngredient(nomeIngrediente){
  // Restituisce TUTTI i prodotti attivi che corrispondono (es. stessa passata da più fornitori)
  const ingTokens = meaningfulTokens(nomeIngrediente);
  if(!ingTokens.length) return [];
  const matches = [];
  logs.produzione.filter(p=>!p.esaurito).forEach(p=>{
    const score = tokenMatchScore(ingTokens, meaningfulTokens(p.prodotto));
    if(score >= 0.6) matches.push({p, score});
  });
  matches.sort((a,b)=> b.score - a.score || (b.p.dataConsegna||"").localeCompare(a.p.dataConsegna||""));
  return matches.map(m=>m.p);
}

// Confronto testo "intelligente": riconosce singolare/plurale (es. "bucatino" trova "bucatini")
// confrontando le radici delle parole, invece di richiedere una corrispondenza esatta.
function normalizeForSearch(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function wordsMatchApprox(word, queryWord){
  if(!word || !queryWord) return false;
  const minLen = Math.min(word.length, queryWord.length);
  // Le parole molto corte (es. articoli/preposizioni come "o", "a", "e") richiedono corrispondenza
  // esatta: altrimenti "o" "contiene" quasi qualsiasi parola più lunga (es. "macinato"), causando
  // risultati fuorvianti nella ricerca.
  if(minLen < 3) return word === queryWord;
  if(word.includes(queryWord) || queryWord.includes(word)) return true;
  if(minLen < 4) return word === queryWord;
  let common = 0;
  while(common < minLen && word[common]===queryWord[common]) common++;
  return common >= Math.max(4, minLen-1);
}
function textMatchesQuery(text, query){
  const normQuery = normalizeForSearch(query).trim();
  if(!normQuery) return true;
  const normText = normalizeForSearch(text);
  if(normText.includes(normQuery)) return true;
  const queryWords = normQuery.split(/\s+/).filter(Boolean);
  const textWords = normText.split(/[\s,]+/).filter(Boolean);
  return queryWords.every(qw => textWords.some(tw => wordsMatchApprox(tw, qw)));
}

function statoRicetta(r){
  const lottiRicetta = logs.produzione.filter(p=>p.semilavorato && p.ricettaId===r.id);
  const ultimoLotto = lottiRicetta.length? lottiRicetta[lottiRicetta.length-1] : null;
  // "Terminata" se: l'amministratore l'ha spuntata a mano, OPPURE l'ultima preparazione fatta
  // è stata segnata "non più disponibile" dall'operatore e non ne è ancora stata fatta una nuova.
  const terminataAuto = !!(ultimoLotto && ultimoLotto.esaurito);
  const terminata = !!r.terminata || terminataAuto;
  const t = todayISO();
  let icona = "", testo = "";
  if(terminata){
    icona = "❌"; testo = r.terminata? "Ricetta terminata" : `Ultima preparazione non più disponibile dal ${fmtDate(ultimoLotto.dataEsaurimento)}`;
  } else if(ultimoLotto){
    if(ultimoLotto.dataScadenza < t){ icona = "🔴"; testo = `Scaduto il ${fmtDate(ultimoLotto.dataScadenza)}`; }
    else if(Math.round((new Date(ultimoLotto.dataScadenza)-new Date(t))/86400000) <= 1){ icona = "🟡"; testo = `In scadenza — scade il ${fmtDate(ultimoLotto.dataScadenza)}`; }
    else { icona = "✅"; testo = `In giacenza — scade il ${fmtDate(ultimoLotto.dataScadenza)}`; }
  }
  return {icona, testo, terminata, ultimoLotto};
}
function ricetteBaseListHtml(query){
  const recipes = config.recipes||[];
  const q = (query||"").trim();
  let filtered = q? recipes.filter(r=>
    textMatchesQuery(r.nome, q) || r.ingredienti.some(i=>textMatchesQuery(i, q))
  ) : recipes;
  if(repartoFiltroRicette) filtered = filtered.filter(r=>(r.reparti||[]).includes(repartoFiltroRicette));
  if(statoFiltroRicette) filtered = filtered.filter(r=>statoRicetta(r).icona===statoFiltroRicette);
  filtered = filtered.filter(r=>hasAnyRepartoAccess(r.reparti));
  if(!filtered.length){
    return q? `<div class="empty">Nessuna ricetta trovata per "${esc(query)}".</div>` : `<div class="empty">Nessuna ricetta ${repartoFiltroRicette||statoFiltroRicette? `corrisponde ai filtri scelti`:"configurata"}.</div>`;
  }
  return filtered.map(r=>{
    const sueComposizioni = logs.composizioni.filter(c=>c.ricettaId===r.id || (!c.ricettaId && c.ricettaNome===r.nome)).slice().reverse();
    const {icona:statoIcona, testo:statoTesto, terminata} = statoRicetta(r);
    return `
    <div class="point-tile" style="cursor:default;${terminata? 'border:2px solid #333;':''}">
      <div class="name">🍽️ ${r.nome} ${r.photoKey? '📷':''} ${statoIcona}</div>
      ${statoTesto? `<div class="muted" style="font-size:11px;font-weight:700;">${statoIcona} ${statoTesto}</div>`:''}
      ${r.reparti&&r.reparti.length? `<div class="muted" style="font-size:11px;">📍 ${r.reparti.join(', ')}</div>`:""}
      <div class="muted">${r.ingredienti.length} ingredienti: ${r.ingredienti.join(', ')}</div>
      ${r.procedimento? `<div class="muted" style="margin-top:4px;">📝 Procedimento trascritto disponibile</div>`:''}
      <div class="rowbtns" style="margin-top:8px;">
        <button class="btn" onclick="openComponiForm('${r.id}')">Componi ora</button>
        <button class="iconbtn" onclick="openRicettaTracciabilita('${r.id}')">🔍 Tracciabilità</button>
        <button class="iconbtn" onclick="openEditRecipe('${r.id}')">✏️ Modifica</button>
      </div>
    </div>
  `;
  }).join("");
}

function composizioniListHtml(query){
  const q = (query||"").trim();
  let list = [...logs.composizioni].sort((a,b)=>(b.data+b.ora).localeCompare(a.data+a.ora));
  if(dateFiltroComposizioni) list = list.filter(c=>c.data===dateFiltroComposizioni);
  if(q){
    list = list.filter(c=>
      textMatchesQuery(c.ricettaNome, q) ||
      textMatchesQuery(c.operatore, q) ||
      textMatchesQuery(c.lottoProdotto, q) ||
      (c.ingredientiUsati||[]).some(i=>textMatchesQuery(i.ingrediente, q))
    );
  } else if(!dateFiltroComposizioni) {
    list = list.slice(0,15);
  }
  if(!list.length) return `<div class="empty">${q||dateFiltroComposizioni? "Nessuna composizione trovata.":"Nessuna composizione registrata ancora."}</div>`;
  return list.map(c=>`
    <div class="logrow" onclick="openComposizioneDetail('${c.id}')" style="cursor:pointer;">
      <div>
        <div class="val">${c.ricettaNome} ${c.ingredientiUsati.some(i=>!i.lotto)? '⚠️':'✅'}${c.photoKey? ' 📷':''}${c.abbattuto? ' ❄️':''}</div>
        <div class="meta">${fmtDate(c.data)} · ${c.ora} · ${c.operatore}</div>
      </div>
      <span class="muted">✏️</span>
    </div>
  `).join("");
}

async function importRicetteBase(){
  if(!config.recipes) config.recipes = [];
  const esistenti = new Set(config.recipes.map(r=>r.nome.trim().toLowerCase()));
  const nuove = RICETTE_BASE_IMPORT.filter(r=>!esistenti.has(r.nome.trim().toLowerCase()));
  if(!nuove.length){ toast("Tutte le ricette base sono già presenti"); return; }
  if(!confirm(`Importare ${nuove.length} ricette base dal food cost (quelle già presenti verranno saltate)?`)) return;
  nuove.forEach(r=>{
    config.recipes.push({ id:uid(), nome:r.nome, ingredienti:[...r.ingredienti], giorniConservazione:r.giorniConservazione, procedimento:r.procedimento });
  });
  activeTab="ricette"; render();
  toast(`✅ Importate ${nuove.length} ricette — controlla i giorni di conservazione di ciascuna`);
  saveConfig().catch(()=>toast("⚠️ Errore di salvataggio, controlla la connessione"));
}

function toggleEsaurisci(i, el){

function selectCandidatoLotto(i, prodId){
  const row = window._componiIngredienti[i];

  row.produzioneId = c.id;

  row.lotto = c.lotto || "";
  row.fornitore = c.fornitore || "";

async function saveComposizione(recipeId){
  const r = config.recipes.find(x=>x.id===recipeId);

  const qtaVal = document.getElementById("componiQta").value.trim();

  if(!op){ toast("Inserisci l'operatore"); return; }
  if(!qtaVal){ errEl.textContent = "⚠️ Campo obbligatorio mancante: indica la quantità preparata."; return; }
  if(!window._composizionePhoto){ errEl.textContent = "⚠️ Campo obbligatorio mancante: allega una foto del preparato."; return; }
  if(window._componiAbbattuto.attivo!==true && window._componiAbbattuto.attivo!==false){ errEl.textContent = "⚠️ Campo obbligatorio mancante: indica se il prodotto è abbattuto o non abbattuto."; return; }
